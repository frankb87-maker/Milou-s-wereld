#gameCanvas{position:absolute;top:0;left:0;touch-action:none;display:block;}

.hud-stat{background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.15);

.back-btn{background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.15);

.panel-greep{width:38px;height:4px;background:rgba(255,255,255,0.15);

.panel-titel{font-family:'Pacifico',cursive;font-size:1.05rem;text-align:center;

.s-card{background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.1);

.pbtn{width:100%;padding:13px;border:none;border-radius:14px;

.srv-glas{font-size:4.2rem;animation:wob .7s ease;}

.srv-score{font-family:'Pacifico',cursive;font-size:2.2rem;color:#ffe066;

.star{position:fixed;pointer-events:none;z-index:500;

var gc=document.getElementById('gameCanvas');
var gx=gc.getContext('2d');
var W,H;
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  gc.width=W;gc.height=H;
}
resize();
window.addEventListener('resize',function(){resize();});

var score=0,nKlanten=0;
var dier=null,smootje=null,gekozenIng=[];
var dierX,dierY,dierRicht=-1,dierLoopt=false;
var beenHoek=0,armHoek=0,idleT=0;
var wolkTekst='',wolkAlpha=0,wolkTimer=0;
var barSmootje=false;
var gameStaat='idle';
var T=0; // globale teller

var kStappen=[],kStap=0;
var modus='smoothie'; // 'smoothie' of 'ijs'
var gekozenSmaak=null,gekozenToppings=[];
var ijsMachineStap=0,ijsMachineStappen=[];
var ijsSchepAnim=0,ijsToppingAnim=[];
var blFase=0,blRot=0,blInhoud=[];
var kCtx=null,kAnimId=null;

var snijCtx=null,snijItems=[],snijGesneden=0,snijCb=null;
var snijTekening=false,snijLast=null;

// ══════════════════════════════════════════════════
// LOOP
// ══════════════════════════════════════════════════
function loop(){
  requestAnimationFrame(loop);
  T++;
  update();
  draw();
}

function update(){
  idleT+=0.03;
  if(dierLoopt){
    var doel=gameStaat==='wacht_stoel'?W*0.13:W*0.38;
    if(gameStaat==='loopt_weg') doel=W*1.2;
    var dx=doel-dierX;
    if(Math.abs(dx)>3){
      dierX+=dx*0.045;
      dierRicht=dx>0?1:-1;
      beenHoek=Math.sin(T*0.28)*0.45;
      armHoek=Math.sin(T*0.28+Math.PI)*0.4;
    } else {
      dierX=doel; dierLoopt=false; beenHoek=0; armHoek=0;
      if(gameStaat==='loopt_in'){
        gameStaat='bestellen';
        setTimeout(toonBestellenPanel,500);
        toonWolk('😋 Ik wil graag iets lekkers...',2800);
        setFase('💬 '+dier.nm+' wil bestellen!',true);
      } else if(gameStaat==='wacht_stoel'){
        setFase('👨‍🍳 Milou gaat koken!',true);
        setTimeout(openKeuken,700);
      } else if(gameStaat==='loopt_bar'){
        gameStaat='ophalen';
        toonWolk('😍 Ohh! Is dat voor mij?!',2200);
        setTimeout(toonSrv,1500);
      } else if(gameStaat==='loopt_weg'){
        dierLoopt=false;
        setTimeout(nieuweKlant,400);
      }
    }
  } else {
    armHoek=Math.sin(idleT)*0.1;
  }
  if(wolkTimer>0){wolkTimer--;wolkAlpha=Math.min(1,wolkAlpha+0.1);}
  else wolkAlpha=Math.max(0,wolkAlpha-0.06);
  if(blFase===2) blRot+=0.22;
}

// ══════════════════════════════════════════════════
// TEKEN HELPERS
// ══════════════════════════════════════════════════
function rr(c,x,y,w,h,r,f,s,lw){
  c.beginPath();
  c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();
  if(f){c.fillStyle=f;c.fill();}
  if(s){c.strokeStyle=s;c.lineWidth=lw||2;c.stroke();}
}
function circ(c,x,y,r,f,s,lw){
  c.beginPath();c.arc(x,y,r,0,Math.PI*2);
  if(f){c.fillStyle=f;c.fill();}
  if(s){c.strokeStyle=s;c.lineWidth=lw||2;c.stroke();}
}
function shadow(c,col,blur){c.shadowColor=col||'transparent';c.shadowBlur=blur||0;}
function noShadow(c){c.shadowColor='transparent';c.shadowBlur=0;}

// ══════════════════════════════════════════════════
// DRAW SALON
// ══════════════════════════════════════════════════
var vloerY;
function draw(){
  gx.clearRect(0,0,W,H);
  vloerY=H*0.70;
  tekenSalon();
  if(dier) tekenDier(gx,dierX,vloerY,dier,dierRicht);
  if(wolkAlpha>0.02&&dier) tekenWolk(gx,dierX,vloerY-getDierH()*0.85);
  if(barSmootje&&smootje) tekenBarGlas(gx);
}

function tekenSalon(){
  var c=gx;
  // SKY / PLAFOND
  var skyG=c.createLinearGradient(0,0,0,H*0.09);
  skyG.addColorStop(0,'#fff9f0');skyG.addColorStop(1,'#ffe8c8');
  c.fillStyle=skyG;c.fillRect(0,0,W,H*0.09);
  // Kroonlijst
  var klijst=c.createLinearGradient(0,H*0.085,0,H*0.1);
  klijst.addColorStop(0,'#d4a870');klijst.addColorStop(1,'#c8956a');
  c.fillStyle=klijst;c.fillRect(0,H*0.085,W,H*0.018);

  // MUUR — behang stijl
  var muurG=c.createLinearGradient(0,H*0.1,W,H*0.7);
  muurG.addColorStop(0,'#fdf6ec');muurG.addColorStop(0.5,'#fff9f2');muurG.addColorStop(1,'#fdf0e4');
  c.fillStyle=muurG;c.fillRect(0,H*0.1,W,vloerY-H*0.1);
  // Behang streepjes
  c.strokeStyle='rgba(210,175,130,0.18)';c.lineWidth=1;
  for(var i=0;i<W;i+=W/14){
    c.beginPath();c.moveTo(i,H*0.1);c.lineTo(i,vloerY);c.stroke();
  }
  // Lambrisering (houten latten onderaan muur)
  var lambH=vloerY*0.18;
  var lambG=c.createLinearGradient(0,vloerY-lambH,0,vloerY);
  lambG.addColorStop(0,'#c8a070');lambG.addColorStop(1,'#a07040');
  c.fillStyle=lambG;c.fillRect(0,vloerY-lambH,W,lambH);
  // Latten lijnen
  c.strokeStyle='rgba(120,80,30,0.25)';c.lineWidth=1.5;
  for(var j=0;j<5;j++){
    var ly2=vloerY-lambH+j*(lambH/5);
    c.beginPath();c.moveTo(0,ly2);c.lineTo(W,ly2);c.stroke();
  }
  // Lambrisering rand
  c.fillStyle='#8B5E3C';c.fillRect(0,vloerY-lambH-3,W,5);

  // VLOER met houten planken
  var vloerG=c.createLinearGradient(0,vloerY,0,H);
  vloerG.addColorStop(0,'#b8864e');vloerG.addColorStop(0.5,'#a07040');vloerG.addColorStop(1,'#8B6330');
  c.fillStyle=vloerG;c.fillRect(0,vloerY,W,H-vloerY);
  // Planken
  var plankH=(H-vloerY)/5;
  for(var pi=0;pi<=5;pi++){
    c.strokeStyle='rgba(60,30,10,0.18)';c.lineWidth=1.5;
    c.beginPath();c.moveTo(0,vloerY+pi*plankH);c.lineTo(W,vloerY+pi*plankH);c.stroke();
  }
  var plankB=W/7;
  for(var pj=0;pj<=7;pj++){
    c.strokeStyle='rgba(60,30,10,0.1)';c.lineWidth=1;
    c.beginPath();c.moveTo(pj*plankB,vloerY);c.lineTo(pj*plankB,H);c.stroke();
  }
  // Vloer glans
  var vloeGl=c.createLinearGradient(0,vloerY,0,vloerY+20);
  vloeGl.addColorStop(0,'rgba(255,255,255,0.12)');vloeGl.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=vloeGl;c.fillRect(0,vloerY,W,20);

  // RAAM (links)
  tekenRaam(c,W*0.04,H*0.13,W*0.18,H*0.26);
  // SCHILDERIJ (midden rechts)
  tekenSchilderij(c,W*0.62,H*0.14,W*0.17,H*0.18);
  // LAMP aan plafond
  tekenLamp(c,W*0.5,H*0.085);
  // LAMP 2
  tekenLamp(c,W*0.25,H*0.085);
  tekenLamp(c,W*0.75,H*0.085);
  // PLANT links
  tekenPlant(c,W*0.11,vloerY,1);
  // PLANT rechts
  tekenPlant(c,W*0.89,vloerY,-1);
  // KEUKEN DEUR
  tekenKeukenDeur(c,W*0.025,vloerY);
  // INGANG DEUR
  tekenIngangsDeur(c,W*0.875,vloerY);
  // KRUK (stoel naast deur)
  tekenKruk(c,W*0.17,vloerY);
  // BAR
  tekenBar(c,vloerY);
  // BARTENDER
  tekenBartender(c,W*0.5,vloerY);
  // BAR decoraties
  tekenBarDeco(c,vloerY);
}

// ── RAAM ──
function tekenRaam(c,x,y,w,h){
  // Schaduw
  shadow(c,'rgba(0,0,0,0.15)',10);
  // Kozijn
  rr(c,x-4,y-4,w+8,h+8,5,'#c8a870','#a07040',3);
  noShadow(c);
  // Lucht gradient
  var hemel=c.createLinearGradient(x,y,x,y+h);
  hemel.addColorStop(0,'#87ceeb');hemel.addColorStop(0.6,'#b8e0f7');hemel.addColorStop(1,'#d0eeff');
  rr(c,x,y,w,h,2,null);c.fillStyle=hemel;c.fill();
  // Wolken
  function wolkje2(cx,cy,sz){
    c.fillStyle='rgba(255,255,255,0.92)';
    circ(c,cx,cy,sz*0.55,'rgba(255,255,255,0.92)');
    circ(c,cx+sz*0.5,cy+sz*0.2,sz*0.42,'rgba(255,255,255,0.92)');
    circ(c,cx-sz*0.4,cy+sz*0.18,sz*0.38,'rgba(255,255,255,0.92)');
    circ(c,cx+sz*0.15,cy+sz*0.4,sz*0.3,'rgba(255,255,255,0.92)');
  }
  var cscl=Math.sin(T*0.008)*3;
  wolkje2(x+w*0.3,y+h*0.2,w*0.14+cscl);
  wolkje2(x+w*0.7,y+h*0.32,w*0.1);
  // Zon
  var sunX=x+w*0.78,sunY=y+h*0.15;
  shadow(c,'rgba(255,200,50,0.5)',12);
  circ(c,sunX,sunY,w*0.1,'#ffe066');
  noShadow(c);
  circ(c,sunX,sunY,w*0.1,null,'rgba(255,220,80,0.4)',2);
  // Bomen buiten
  c.fillStyle='#4a7c40';
  for(var ti=0;ti<3;ti++){
    var tx=x+w*(0.15+ti*0.32),th=h*0.35;
    c.beginPath();c.moveTo(tx,y+h-h*0.12);c.lineTo(tx-w*0.06,y+h*0.8);c.lineTo(tx+w*0.06,y+h*0.8);c.closePath();c.fill();
    c.beginPath();c.moveTo(tx,y+h*0.55);c.lineTo(tx-w*0.08,y+h*0.72);c.lineTo(tx+w*0.08,y+h*0.72);c.closePath();c.fill();
    c.fillStyle='#8B4513';rr(c,tx-w*0.015,y+h*0.8,w*0.03,h*0.2,1,'#8B4513');
    c.fillStyle='#4a7c40';
  }
  // Raamkruisen
  c.strokeStyle='#c8a870';c.lineWidth=3;
  c.beginPath();c.moveTo(x+w/2,y);c.lineTo(x+w/2,y+h);c.stroke();
  c.beginPath();c.moveTo(x,y+h/2);c.lineTo(x+w,y+h/2);c.stroke();
  // Kozijn rand
  c.strokeStyle='#a07040';c.lineWidth=4;
  rr(c,x,y,w,h,2,null,'#a07040',4);
  // Vensterbank
  rr(c,x-6,y+h,w+12,8,3,'#e8d4a8','#c8a870',1.5);
  // Gordijnen
  var gA=c.createLinearGradient(x,y,x+w*0.2,y);
  gA.addColorStop(0,'#ff8fab');gA.addColorStop(1,'rgba(255,143,171,0)');
  c.fillStyle=gA;c.fillRect(x,y,w*0.22,h);
  var gB=c.createLinearGradient(x+w,y,x+w*0.8,y);
  gB.addColorStop(0,'#ff8fab');gB.addColorStop(1,'rgba(255,143,171,0)');
  c.fillStyle=gB;c.fillRect(x+w*0.78,y,w*0.22,h);
  // Gordijn knopen
  c.fillStyle='#e91e8c';circ(c,x+w*0.19,y+h*0.5,4,'#e91e8c');
  circ(c,x+w*0.81,y+h*0.5,4,'#e91e8c');
}

// ── SCHILDERIJ ──
function tekenSchilderij(c,x,y,w,h){
  shadow(c,'rgba(0,0,0,0.2)',8);
  // Lijst
  rr(c,x-5,y-5,w+10,h+10,4,'#8B6914','#5a3a00',2);
  noShadow(c);
  // Binnenrand
  rr(c,x-2,y-2,w+4,h+4,2,'#c8a050');
  // Canvas
  var achterG=c.createLinearGradient(x,y,x+w,y+h);
  achterG.addColorStop(0,'#e8f4e8');achterG.addColorStop(1,'#d4ecd4');
  rr(c,x,y,w,h,2,null);c.fillStyle=achterG;c.fill();
  // Schilderij inhoud: smoothies
  c.font='bold '+Math.round(h*0.22)+'px serif';
  c.textAlign='center';
  c.fillText('🥤🍓🥝',x+w/2,y+h*0.55);
  c.fillStyle='#2e7d32';
  c.font='bold '+Math.round(h*0.13)+'px Nunito';
  c.fillText('SMOOTHIE SALON',x+w/2,y+h*0.82);
  // Glas effect
  c.fillStyle='rgba(255,255,255,0.15)';
  c.beginPath();c.moveTo(x,y);c.lineTo(x+w*0.4,y);c.lineTo(x,y+h*0.5);c.closePath();c.fill();
}

// ── LAMP ──
function tekenLamp(c,x,y){
  // Draad
  var draadG=c.createLinearGradient(x,y,x,y+H*0.05);
  draadG.addColorStop(0,'#888');draadG.addColorStop(1,'#555');
  c.strokeStyle=draadG;c.lineWidth=2;
  c.beginPath();c.moveTo(x,y);c.lineTo(x,y+H*0.05);c.stroke();
  // Kap
  var kapW=W*0.055,kapH=H*0.04;
  var kapG=c.createLinearGradient(x-kapW/2,y+H*0.05,x+kapW/2,y+H*0.05+kapH);
  kapG.addColorStop(0,'#f5e6c8');kapG.addColorStop(1,'#d4b870');
  c.beginPath();c.moveTo(x-kapW*0.4,y+H*0.05);
  c.lineTo(x-kapW/2,y+H*0.05+kapH);c.lineTo(x+kapW/2,y+H*0.05+kapH);
  c.lineTo(x+kapW*0.4,y+H*0.05);c.closePath();
  c.fillStyle=kapG;c.fill();
  c.strokeStyle='#c8a050';c.lineWidth=1.5;c.stroke();
  // Lichtglow
  var p=0.7+0.3*Math.sin(T*0.05);
  var lichG=c.createRadialGradient(x,y+H*0.07,0,x,y+H*0.07,W*0.12*p);
  lichG.addColorStop(0,'rgba(255,240,180,0.18)');
  lichG.addColorStop(1,'rgba(255,240,180,0)');
  c.fillStyle=lichG;c.fillRect(x-W*0.12,y,W*0.24,H*0.25);
  // Bol
  shadow(c,'rgba(255,220,100,0.6)',8*p);
  circ(c,x,y+H*0.055,W*0.013,'#fff9e0');
  noShadow(c);
}

// ── PLANT ──
function tekenPlant(c,x,y,spiegel){
  var s=spiegel||1;
  c.save();c.translate(x,y);c.scale(s,1);
  // Pot
  var potW=W*0.035,potH=H*0.05;
  var potG=c.createLinearGradient(-potW/2,0,potW/2,potH);
  potG.addColorStop(0,'#c8956a');potG.addColorStop(1,'#a06040');
  c.beginPath();c.moveTo(-potW/2,0);c.lineTo(potW/2,0);
  c.lineTo(potW*0.4,potH);c.lineTo(-potW*0.4,potH);c.closePath();
  c.fillStyle=potG;c.fill();
  c.strokeStyle='#8B5E3C';c.lineWidth=1.5;c.stroke();
  // Aarde
  rr(c,-potW/2,-potH*0.12,potW,potH*0.18,2,'#5a3a1a');
  // Stam
  c.strokeStyle='#8B5E3C';c.lineWidth=W*0.006;c.lineCap='round';
  c.beginPath();c.moveTo(0,-potH*0.1);c.lineTo(0,-H*0.09);c.stroke();
  // Tak links
  c.beginPath();c.moveTo(0,-H*0.055);c.quadraticCurveTo(-W*0.04,-H*0.07,-W*0.05,-H*0.065);c.stroke();
  // Tak rechts
  c.beginPath();c.moveTo(0,-H*0.07);c.quadraticCurveTo(W*0.035,-H*0.085,W*0.045,-H*0.078);c.stroke();
  // Bladeren
  function blad(bx,by,br,ba){
    c.save();c.translate(bx,by);c.rotate(ba);
    var bg=c.createRadialGradient(0,0,0,0,0,br);
    bg.addColorStop(0,'#66bb6a');bg.addColorStop(1,'#2e7d32');
    c.beginPath();c.ellipse(0,0,br*0.55,br,0,0,Math.PI*2);
    c.fillStyle=bg;c.fill();
    c.strokeStyle='#1b5e20';c.lineWidth=0.8;c.stroke();
    // Nerf
    c.strokeStyle='rgba(255,255,255,0.2)';c.lineWidth=0.8;
    c.beginPath();c.moveTo(0,-br*0.8);c.lineTo(0,br*0.8);c.stroke();
    c.restore();
  }
  blad(0,-H*0.09,H*0.042,0);
  blad(-W*0.05,-H*0.065,H*0.034,0.4);
  blad(W*0.045,-H*0.078,H*0.034,-0.3);
  blad(-W*0.025,-H*0.1,H*0.03,0.6);
  blad(W*0.02,-H*0.095,H*0.028,-0.5);
  blad(0,-H*0.115,H*0.025,0.1);
  c.restore();
}

// ── KRUK ──
function tekenKruk(c,x,y){
  var kw=W*0.04,kh=H*0.065;
  // Poten
  c.strokeStyle='#5a2d0c';c.lineWidth=W*0.008;c.lineCap='round';
  c.beginPath();c.moveTo(x-kw*0.4,y);c.lineTo(x-kw*0.5,y-kh);c.stroke();
  c.beginPath();c.moveTo(x+kw*0.4,y);c.lineTo(x+kw*0.5,y-kh);c.stroke();
  // Dwarsbalk
  c.lineWidth=W*0.005;
  c.beginPath();c.moveTo(x-kw*0.48,y-kh*0.45);c.lineTo(x+kw*0.48,y-kh*0.45);c.stroke();
  // Zitting
  var zG=c.createLinearGradient(x-kw*0.65,y-kh,x+kw*0.65,y-kh+6);
  zG.addColorStop(0,'#8B4513');zG.addColorStop(1,'#6b3410');
  rr(c,x-kw*0.65,y-kh,kw*1.3,kh*0.18,4,null,null);
  c.fillStyle=zG;c.fill();
  c.strokeStyle='#5a2d0c';c.lineWidth=1.5;c.stroke();
}

// ── KEUKEN DEUR ──
function tekenKeukenDeur(c,x,y){
  var dw=W*0.1,dh=H*0.24;
  shadow(c,'rgba(0,0,0,0.2)',6);
  // Deur frame
  rr(c,x-4,y-dh-4,dw+8,dh+4,4,'#2d5a1b','#1a3a10',2);
  noShadow(c);
  // Deur
  var dg=c.createLinearGradient(x,y-dh,x+dw,y);
  dg.addColorStop(0,'#3d7a25');dg.addColorStop(1,'#2d5a1b');
  rr(c,x,y-dh,dw,dh,3,null);c.fillStyle=dg;c.fill();
  c.strokeStyle='#1a3a10';c.lineWidth=2;c.stroke();
  // Panelen
  rr(c,x+dw*0.12,y-dh*0.95,dw*0.76,dh*0.4,3,'rgba(0,0,0,0.12)','rgba(0,0,0,0.08)',1);
  rr(c,x+dw*0.12,y-dh*0.5,dw*0.76,dh*0.36,3,'rgba(0,0,0,0.12)','rgba(0,0,0,0.08)',1);
  // Ruitje
  var rg=c.createLinearGradient(x+dw*0.2,y-dh*0.88,x+dw*0.8,y-dh*0.6);
  rg.addColorStop(0,'rgba(135,206,235,0.7)');rg.addColorStop(1,'rgba(176,224,255,0.7)');
  rr(c,x+dw*0.2,y-dh*0.9,dw*0.6,dh*0.28,2,null);c.fillStyle=rg;c.fill();
  // Kruis in ruitje
  c.strokeStyle='rgba(45,90,27,0.5)';c.lineWidth=1.5;
  c.beginPath();c.moveTo(x+dw*0.5,y-dh*0.9);c.lineTo(x+dw*0.5,y-dh*0.62);c.stroke();
  c.beginPath();c.moveTo(x+dw*0.2,y-dh*0.76);c.lineTo(x+dw*0.8,y-dh*0.76);c.stroke();
  // Knop
  shadow(c,'rgba(255,200,0,0.4)',4);
  circ(c,x+dw*0.82,y-dh*0.45,W*0.006,'#f0c060','#c8a040',1.5);
  noShadow(c);
  // Bordje KEUKEN
  rr(c,x+dw*0.1,y-dh*0.25,dw*0.8,dh*0.12,3,'#ffe066','#f0c000',1);
  c.fillStyle='#3a2a00';c.font='bold '+Math.round(dw*0.22)+'px Nunito';c.textAlign='center';
  c.fillText('KEUKEN',x+dw/2,y-dh*0.17);
  // Pijl
  c.fillStyle='#3d7a25';
  c.font=Math.round(dw*0.3)+'px serif';
  c.fillText('👨‍🍳',x+dw/2,y-dh*0.32);
}

// ── INGANGS DEUR ──
function tekenIngangsDeur(c,x,y){
  var dw=W*0.1,dh=H*0.24;
  shadow(c,'rgba(0,0,0,0.2)',6);
  rr(c,x-4,y-dh-4,dw+8,dh+4,4,'#5a2d0c','#3a1a00',2);
  noShadow(c);
  var dg=c.createLinearGradient(x,y-dh,x+dw,y);
  dg.addColorStop(0,'#a0522d');dg.addColorStop(1,'#7a3a18');
  rr(c,x,y-dh,dw,dh,3,null);c.fillStyle=dg;c.fill();
  c.strokeStyle='#3a1a00';c.lineWidth=2;c.stroke();
  rr(c,x+dw*0.12,y-dh*0.95,dw*0.76,dh*0.4,3,'rgba(0,0,0,0.1)','rgba(0,0,0,0.07)',1);
  rr(c,x+dw*0.12,y-dh*0.5,dw*0.76,dh*0.36,3,'rgba(0,0,0,0.1)','rgba(0,0,0,0.07)',1);
  // Boogvenster
  c.save();c.beginPath();c.arc(x+dw/2,y-dh*0.96,dw*0.3,Math.PI,0);c.closePath();
  c.fillStyle='rgba(135,206,235,0.65)';c.fill();
  c.strokeStyle='#3a1a00';c.lineWidth=2;c.stroke();c.restore();
  shadow(c,'rgba(255,200,0,0.4)',4);
  circ(c,x+dw*0.18,y-dh*0.45,W*0.006,'#f0c060','#c8a040',1.5);
  noShadow(c);
  // Bel
  c.font=Math.round(dw*0.38)+'px serif';c.textAlign='center';
  c.fillText('🔔',x+dw/2,y-dh-5);
}

// ── BAR ──
function tekenBar(c,vy){
  var barW=W*0.52,bx=W*0.245;
  var topH=H*0.038,bodyH=H*0.1;
  var by=vy-bodyH-topH;

  // Achterste muurplank boven bar
  var plankG=c.createLinearGradient(bx,by-H*0.15,bx,by);
  plankG.addColorStop(0,'#c8a870');plankG.addColorStop(1,'#a07040');
  rr(c,bx-barW*0.05,by-H*0.16,barW*1.1,H*0.165,4,null);c.fillStyle=plankG;c.fill();
  c.strokeStyle='#8B5E3C';c.lineWidth=2;c.stroke();
  // Planken rand
  rr(c,bx-barW*0.05,by-H*0.16,barW*1.1,H*0.018,2,'#d4b870','#c8a050',1);

  // Bar achtergrond spiegel
  rr(c,bx+barW*0.05,by-H*0.155,barW*0.9,H*0.14,4,null,null);
  var spieG=c.createLinearGradient(bx,by-H*0.15,bx+barW,by);
  spieG.addColorStop(0,'rgba(200,230,255,0.35)');spieG.addColorStop(0.5,'rgba(220,240,255,0.5)');spieG.addColorStop(1,'rgba(200,230,255,0.35)');
  c.fillStyle=spieG;c.fill();
  c.strokeStyle='rgba(180,210,240,0.4)';c.lineWidth=2;c.stroke();
  // Spiegels glans
  c.fillStyle='rgba(255,255,255,0.15)';
  c.beginPath();c.moveTo(bx+barW*0.1,by-H*0.155);c.lineTo(bx+barW*0.25,by-H*0.155);
  c.lineTo(bx+barW*0.15,by-H*0.015);c.lineTo(bx+barW*0.05,by-H*0.015);c.closePath();c.fill();

  // Flessen op plank
  var flessen=[
    {kl:'#ff6eb4',dop:'#c21e8c'},{kl:'#ffe066',dop:'#f9a825'},
    {kl:'#64b5f6',dop:'#1565c0'},{kl:'#a5d6a7',dop:'#2e7d32'},
    {kl:'#ef9a9a',dop:'#c62828'},{kl:'#ce93d8',dop:'#6a1b9a'},
  ];
  flessen.forEach(function(f,i){
    var fx=bx+barW*(0.08+i*0.155),fy=by-topH*0.5;
    var fw=barW*0.045,fh=H*0.09;
    // Fles
    rr(c,fx-fw/2,fy-fh,fw,fh*0.7,fw*0.4,f.kl,'rgba(0,0,0,0.15)',1);
    // Nek
    rr(c,fx-fw*0.25,fy-fh,fw*0.5,fh*0.32,fw*0.25,f.kl,null);
    // Dop
    rr(c,fx-fw*0.22,fy-fh*1.05,fw*0.44,fh*0.1,2,f.dop,null);
    // Glans
    c.fillStyle='rgba(255,255,255,0.3)';
    rr(c,fx-fw*0.3,fy-fh*0.9,fw*0.15,fh*0.45,3,'rgba(255,255,255,0.3)');
  });

  // Bar body
  shadow(c,'rgba(0,0,0,0.25)',12);
  var bodyG=c.createLinearGradient(bx,by+topH,bx,by+topH+bodyH);
  bodyG.addColorStop(0,'#8B4513');bodyG.addColorStop(1,'#4a1a00');
  rr(c,bx,by+topH,barW,bodyH,5,null);c.fillStyle=bodyG;c.fill();
  c.strokeStyle='#3a0e00';c.lineWidth=2;c.stroke();
  noShadow(c);

  // Decoratieve panelen in bar body
  for(var pi=0;pi<3;pi++){
    var px=bx+barW*(0.04+pi*0.32),py=by+topH+bodyH*0.12;
    rr(c,px,py,barW*0.28,bodyH*0.72,5,'rgba(255,255,255,0.04)','rgba(255,255,255,0.08)',1);
    // Knop midden
    circ(c,px+barW*0.14,py+bodyH*0.36,W*0.006,'#c8a050','#a07030',1);
  }

  // Bar bovenkant (blad)
  var topG=c.createLinearGradient(bx-barW*0.03,by,bx-barW*0.03+barW*1.06,by);
  topG.addColorStop(0,'#c8a870');topG.addColorStop(0.3,'#f5deb3');topG.addColorStop(0.7,'#e8cb90');topG.addColorStop(1,'#c8a870');
  shadow(c,'rgba(0,0,0,0.2)',8);
  rr(c,bx-barW*0.03,by,barW*1.06,topH,7,null);c.fillStyle=topG;c.fill();
  c.strokeStyle='#a07040';c.lineWidth=2;c.stroke();
  noShadow(c);
  // Glans op bovenkant
  c.fillStyle='rgba(255,255,255,0.25)';
  rr(c,bx-barW*0.03+3,by+2,barW*1.06-6,topH*0.38,5,'rgba(255,255,255,0.25)');

  // Lampjes
  var lkl=['#ff6eb4','#ffe066','#64b5f6','#4caf50','#ff9800','#ce93d8','#ff5252','#80deea'];
  for(var li=0;li<12;li++){
    var lx=bx+li*(barW/11);
    var lkk=lkl[li%lkl.length];
    var lp=0.55+0.45*Math.sin(T*0.09+li*0.65);
    shadow(c,lkk,10*lp);
    circ(c,lx,by-2,W*0.005,lkk);
    noShadow(c);
  }
}

// ── BAR DECO (items op bar) ──
function tekenBarDeco(c,vy){
  var bx=W*0.245,barW=W*0.52;
  var topH=H*0.038,bodyH=H*0.1;
  var by=vy-bodyH-topH;
  // Servethouder
  var sh_x=bx+barW*0.72,sh_y=by-topH*0.1;
  rr(c,sh_x-W*0.015,sh_y-H*0.045,W*0.03,H*0.045,2,'#c8a870','#a07040',1);
  for(var si2=0;si2<5;si2++){
    c.strokeStyle='rgba(255,255,255,0.6)';c.lineWidth=0.8;
    c.beginPath();c.moveTo(sh_x-W*0.012,sh_y-H*0.04+si2*H*0.007);
    c.lineTo(sh_x+W*0.012,sh_y-H*0.04+si2*H*0.007);c.stroke();
  }
  // Rietjes pot
  var rp_x=bx+barW*0.2,rp_y=by-topH*0.1;
  circ(c,rp_x,rp_y-H*0.025,H*0.025,'rgba(0,0,0,0.1)');
  rr(c,rp_x-W*0.012,rp_y-H*0.05,W*0.024,H*0.05,3,'#8B4513','#5a2d0c',1);
  var rietkl=['#ff6eb4','#ffe066','#64b5f6','#4caf50'];
  for(var ri=0;ri<4;ri++){
    c.strokeStyle=rietkl[ri];c.lineWidth=2;
    c.beginPath();c.moveTo(rp_x-W*0.006+ri*W*0.004,rp_y-H*0.045);
    c.lineTo(rp_x-W*0.009+ri*W*0.004,rp_y-H*0.09);c.stroke();
  }
  // Kassa
  var kx=bx+barW*0.5,ky=by-topH*0.1;
  rr(c,kx-W*0.038,ky-H*0.075,W*0.076,H*0.075,4,'#2d2d2d','#1a1a1a',1);
  rr(c,kx-W*0.032,ky-H*0.07,W*0.064,H*0.04,3,'#1a8a1a','#0d5a0d',1);
  c.fillStyle='#aaff88';c.font='bold '+Math.round(H*0.018)+'px Nunito';c.textAlign='center';
  c.fillText('€ 3.50',kx,ky-H*0.04);
  // Knoppen
  for(var ki=0;ki<9;ki++){
    rr(c,kx-W*0.028+ki%3*W*0.019,ky-H*0.025+Math.floor(ki/3)*H*0.013,W*0.015,H*0.01,2,'#444444','#222',0.5);
  }
}

// ── BARTENDER ──
function tekenBartender(c,cx,vy){
  var bx=W*0.245,barW=W*0.52,topH=H*0.038,bodyH=H*0.1;
  var barTopY=vy-bodyH-topH;
  var scy=barTopY-H*0.01;
  var schaal=Math.min(1.1,H/680);
  var tH=H*0.16*schaal;
  var hR=H*0.058*schaal;
  var aL=H*0.1*schaal,aW=W*0.025*schaal;
  var bL=H*0.0*schaal;
  var aWig=Math.sin(T*0.04)*0.12;

  c.save();c.translate(cx,scy);

  // Schaduw
  c.fillStyle='rgba(0,0,0,0.1)';
  c.beginPath();c.ellipse(0,0,W*0.06,H*0.015,0,0,Math.PI*2);c.fill();

  // Broek / rok
  var rokG=c.createLinearGradient(-W*0.04,-tH*0.15,W*0.04,0);
  rokG.addColorStop(0,'#1565c0');rokG.addColorStop(1,'#0d47a1');
  rr(c,-W*0.04,-tH*0.15,W*0.08,tH*0.2,5,null);c.fillStyle=rokG;c.fill();

  // Torso
  var torsoG=c.createLinearGradient(-W*0.042,-tH,W*0.042,0);
  torsoG.addColorStop(0,'#1976d2');torsoG.addColorStop(1,'#1565c0');
  rr(c,-W*0.042,-tH,W*0.084,tH*0.85,W*0.018,null);c.fillStyle=torsoG;c.fill();
  c.strokeStyle='#0d47a1';c.lineWidth=1.5;c.stroke();

  // Schort
  var schortG=c.createLinearGradient(-W*0.028,-tH*0.85,W*0.028,-tH*0.1);
  schortG.addColorStop(0,'#ff80ab');schortG.addColorStop(1,'#ff4081');
  rr(c,-W*0.028,-tH*0.85,W*0.056,tH*0.75,4,null);c.fillStyle=schortG;c.fill();
  // Schort band
  c.strokeStyle='rgba(255,255,255,0.4)';c.lineWidth=2;
  c.beginPath();c.moveTo(-W*0.028,-tH*0.85);c.lineTo(-W*0.042,-tH);c.stroke();
  c.beginPath();c.moveTo(W*0.028,-tH*0.85);c.lineTo(W*0.042,-tH);c.stroke();
  // Schort zak
  rr(c,-W*0.012,-tH*0.45,W*0.024,H*0.04,3,'rgba(255,255,255,0.15)','rgba(255,255,255,0.2)',1);

  // Armen
  c.lineCap='round';
  // Links (actief, roert)
  c.strokeStyle='#1565c0';c.lineWidth=aW;
  c.save();c.translate(-W*0.044,-tH*0.62);c.rotate(0.35+aWig);
  c.beginPath();c.moveTo(0,0);c.lineTo(0,aL);c.stroke();
  c.fillStyle='#f5cba7';circ(c,0,aL,aW*0.55,'#f5cba7');
  // Lepel in hand
  c.strokeStyle='#c8a870';c.lineWidth=2;c.lineCap='round';
  c.beginPath();c.moveTo(0,aL-2);c.lineTo(W*0.025,aL+H*0.045);c.stroke();
  circ(c,W*0.028,aL+H*0.05,W*0.008,'#d4b870');
  c.restore();
  // Rechts
  c.strokeStyle='#1565c0';c.lineWidth=aW;c.lineCap='round';
  c.save();c.translate(W*0.044,-tH*0.62);c.rotate(-0.2-aWig*0.5);
  c.beginPath();c.moveTo(0,0);c.lineTo(0,aL);c.stroke();
  c.fillStyle='#f5cba7';circ(c,0,aL,aW*0.55,'#f5cba7');
  c.restore();

  // Hoofd
  c.translate(0,-tH-hR*0.7);
  // Nek
  var nekG=c.createLinearGradient(-hR*0.2,0,hR*0.2,hR*0.5);
  nekG.addColorStop(0,'#f5cba7');nekG.addColorStop(1,'#e8b896');
  rr(c,-hR*0.22,0,hR*0.44,hR*0.5,hR*0.1,null);c.fillStyle=nekG;c.fill();
  // Hoofd
  var hG=c.createRadialGradient(-hR*0.2,-hR*0.3,0,0,0,hR*1.2);
  hG.addColorStop(0,'#fde3c0');hG.addColorStop(1,'#f5cba7');
  shadow(c,'rgba(0,0,0,0.15)',6);
  circ(c,0,0,hR,null);c.fillStyle=hG;c.fill();
  noShadow(c);
  c.strokeStyle='#e8b896';c.lineWidth=1.5;c.stroke();

  // Haar
  c.fillStyle='#3d1a00';
  c.beginPath();c.arc(0,-hR*0.1,hR*1.02,Math.PI*1.05,Math.PI*0.05);c.closePath();c.fill();
  // Paardenstaart
  c.strokeStyle='#3d1a00';c.lineWidth=hR*0.22;c.lineCap='round';
  c.beginPath();c.moveTo(hR*0.85,-hR*0.1);
  c.quadraticCurveTo(hR*1.4,hR*0.4,hR*1.0,hR*0.9);c.stroke();
  // Haar glans
  c.strokeStyle='rgba(120,60,0,0.3)';c.lineWidth=hR*0.12;
  c.beginPath();c.arc(hR*0.1,-hR*0.2,hR*0.75,Math.PI*1.1,Math.PI*0.3);c.stroke();

  // Koksmuts
  // Band
  rr(c,-hR*0.85,-hR*1.08,hR*1.7,hR*0.3,3,'white','#ddd',1.5);
  // Bol
  c.fillStyle='white';
  c.beginPath();c.arc(0,-hR*1.25,hR*0.62,0,Math.PI*2);c.fill();
  c.strokeStyle='#ddd';c.lineWidth=1;c.stroke();
  // Plooien
  c.strokeStyle='rgba(200,200,200,0.5)';c.lineWidth=1;
  for(var mi=-2;mi<=2;mi++){
    c.beginPath();c.arc(mi*hR*0.25,-hR*1.25,hR*0.4,Math.PI*0.2,Math.PI*0.8);c.stroke();
  }

  // Ogen
  circ(c,-hR*0.3,-hR*0.08,hR*0.12,'#1a1a1a');
  circ(c,hR*0.3,-hR*0.08,hR*0.12,'#1a1a1a');
  // Glins
  circ(c,-hR*0.26,-hR*0.12,hR*0.04,'white');
  circ(c,hR*0.34,-hR*0.12,hR*0.04,'white');
  // Wimpers
  c.strokeStyle='#1a1a1a';c.lineWidth=1.5;c.lineCap='round';
  [[-0.42,-0.18,-0.5,-0.28],[-0.3,-0.2,-0.3,-0.3],[0.42,-0.18,0.5,-0.28],[0.3,-0.2,0.3,-0.3]].forEach(function(l){
    c.beginPath();c.moveTo(l[0]*hR,l[1]*hR);c.lineTo(l[2]*hR,l[3]*hR);c.stroke();
  });
  // Neus
  c.fillStyle='#e8a080';c.beginPath();c.ellipse(0,hR*0.1,hR*0.1,hR*0.07,0,0,Math.PI*2);c.fill();
  // Glimlach
  c.strokeStyle='#c0392b';c.lineWidth=1.8;c.lineCap='round';
  c.beginPath();c.arc(0,hR*0.18,hR*0.28,0.15,Math.PI-0.15);c.stroke();
  // Wangen
  c.fillStyle='rgba(255,150,150,0.35)';
  circ(c,-hR*0.55,hR*0.12,hR*0.18,'rgba(255,150,150,0.35)');
  circ(c,hR*0.55,hR*0.12,hR*0.18,'rgba(255,150,150,0.35)');

  c.restore();
}

// ── WOLKJE MET TEKST ──
function tekenWolk(c,x,y){
  var tekst=wolkTekst;
  if(!tekst)return;
  c.save();c.globalAlpha=wolkAlpha;
  c.font='bold '+Math.round(Math.min(14,W*0.035))+'px Nunito';
  var tw=c.measureText(tekst).width;
  var pw=tw+32,ph=36,r=18;
  var wx=Math.min(Math.max(x-pw/2,8),W-pw-8);
  var wy=y-ph-18;

  // Schaduw
  c.shadowColor='rgba(0,0,0,0.2)';c.shadowBlur=10;c.shadowOffsetY=3;
  // Wolkje achtergrond
  rr(c,wx,wy,pw,ph,r,'white','rgba(200,200,220,0.4)',1.5);
  c.shadowColor='transparent';c.shadowBlur=0;c.shadowOffsetY=0;

  // Puntje naar dier
  var px2=Math.min(Math.max(x,wx+r),wx+pw-r);
  c.fillStyle='white';
  c.beginPath();c.moveTo(px2-7,wy+ph);c.lineTo(px2,wy+ph+14);c.lineTo(px2+7,wy+ph);c.closePath();c.fill();
  // Lijn aan zijkant puntje
  c.strokeStyle='rgba(200,200,220,0.4)';c.lineWidth=1.5;
  c.beginPath();c.moveTo(px2-7,wy+ph);c.lineTo(px2,wy+ph+14);c.lineTo(px2+7,wy+ph);c.stroke();

  // Kleine decoratieve bolletjes (cloud-stijl)
  c.fillStyle='white';
  circ(c,wx+r*0.5,wy+2,7,'white');
  circ(c,wx+r*1.5,wy-2,9,'white');
  circ(c,wx+pw-r*0.5,wy+2,7,'white');

  // Tekst
  c.fillStyle='#2d1a3a';
  c.textAlign='left';
  c.fillText(tekst,wx+16,wy+ph*0.67);
  c.restore();
}

// ── BAR GLAS ──
function tekenBarGlas(c){
  var bx=W*0.245,barW=W*0.52,topH=H*0.038,bodyH=H*0.1;
  var vy=vloerY;
  var gx2=bx+barW*0.55,gy=vy-bodyH-topH-H*0.14;
  var gw=W*0.06,gh=H*0.12;
  var p=0.96+0.04*Math.sin(T*0.1);
  c.save();c.translate(gx2+gw/2,gy+gh/2);c.scale(p,p);c.translate(-(gx2+gw/2),-(gy+gh/2));

  // Glas
  var glasG=c.createLinearGradient(gx2,gy,gx2+gw,gy);
  glasG.addColorStop(0,'rgba(200,235,255,0.35)');
  glasG.addColorStop(0.3,'rgba(230,245,255,0.5)');
  glasG.addColorStop(1,'rgba(200,235,255,0.35)');
  c.beginPath();c.moveTo(gx2,gy);c.lineTo(gx2+gw,gy);
  c.lineTo(gx2+gw*0.85,gy+gh);c.lineTo(gx2+gw*0.15,gy+gh);c.closePath();
  c.fillStyle=glasG;c.fill();
  c.strokeStyle='rgba(180,220,255,0.7)';c.lineWidth=2;c.stroke();

  // Vulling
  if(smootje){
    var vulG=c.createLinearGradient(gx2,gy+4,gx2+gw,gy+gh);
    vulG.addColorStop(0,smootje.kl+'cc');vulG.addColorStop(1,smootje.kl);
    c.beginPath();c.moveTo(gx2+2,gy+5);c.lineTo(gx2+gw-2,gy+5);
    c.lineTo(gx2+gw*0.83,gy+gh-2);c.lineTo(gx2+gw*0.17,gy+gh-2);c.closePath();
    c.fillStyle=vulG;c.fill();
    // Schuimlaag
    c.fillStyle='rgba(255,255,255,0.55)';
    c.beginPath();c.moveTo(gx2+2,gy+4);c.lineTo(gx2+gw-2,gy+4);
    c.lineTo(gx2+gw-3,gy+12);c.lineTo(gx2+3,gy+12);c.closePath();c.fill();
    // Bubbels
    c.fillStyle='rgba(255,255,255,0.45)';
    for(var bi=0;bi<5;bi++){
      var bx2=gx2+gw*0.2+bi*gw*0.14,by2=gy+gh*0.4+Math.sin(T*0.1+bi)*H*0.015;
      circ(c,bx2,by2,2+bi*0.8,'rgba(255,255,255,0.45)');
    }
    // Emoji
    c.font=Math.round(gw*0.8)+'px serif';c.textAlign='center';
    c.fillText(smootje.em,gx2+gw/2,gy-5);
  }
  // Rietje
  c.strokeStyle='#ff6eb4';c.lineWidth=3;c.lineCap='round';
  c.beginPath();c.moveTo(gx2+gw*0.72,gy+gh*0.88);c.lineTo(gx2+gw*0.9,gy-8);c.stroke();
  // Schijf limoen
  circ(c,gx2+gw*0.3,gy+4,gw*0.22,'#a5d6a7','#66bb6a',1.5);
  c.strokeStyle='#2e7d32';c.lineWidth=0.8;
  c.beginPath();c.moveTo(gx2+gw*0.3,gy+4-gw*0.22);c.lineTo(gx2+gw*0.3,gy+4+gw*0.22);c.stroke();
  c.restore();
}

// DIER TEKENEN
// ══════════════════════════════════════════════════
function getDierH(){return H*0.22;}

function tekenDier(c,x,y,d,richt){
  var sc=Math.min(1.15,H/640);
  var tW=W*0.075*sc,tH=H*0.12*sc;
  var hR=W*0.045*sc;
  var bL=H*0.08*sc,bW=W*0.022*sc;
  var aL=H*0.072*sc,aW=W*0.02*sc;
  var bHk=dierLoopt?beenHoek:0;
  var aHk=armHoek;
  c.save();c.translate(x,y);c.scale(richt,1);

  // Schaduw
  c.fillStyle='rgba(0,0,0,0.12)';
  c.beginPath();c.ellipse(0,3,tW*0.9,H*0.015,0,0,Math.PI*2);c.fill();

  // STAART
  if(d.type!=='konijn'){
    c.strokeStyle=d.lk;c.lineWidth=bW*1.2;c.lineCap='round';
    var stHk=Math.sin(idleT*1.5)*0.35;
    c.save();c.translate(tW*0.48,-tH*0.5);
    c.beginPath();c.moveTo(0,0);
    c.quadraticCurveTo(tW*(0.6+stHk),-(tH*0.3+stHk*10),tW*0.35,-tH*0.7);
    c.stroke();
    if(d.type==='vos'||d.type==='wasbeer'){
      circ(c,tW*0.35,-tH*0.7,bW*1.4,'white');
    }
    c.restore();
  }

  // BENEN
  c.lineCap='round';c.strokeStyle=d.lk;c.lineWidth=bW;
  // Linker been (achter)
  c.save();c.translate(-tW*0.3,-bL*0.05);c.rotate(-bHk*0.7);
  c.beginPath();c.moveTo(0,0);c.lineTo(0,bL);c.stroke();
  // Voet
  var vG=c.createLinearGradient(-bW,bL,bW,bL+bW*0.6);
  vG.addColorStop(0,d.lk);vG.addColorStop(1,d.ok);
  c.fillStyle=vG;
  c.beginPath();c.ellipse(bL*0.12*Math.sin(-bHk*0.7),bL+bW*0.4,bW*1.3,bW*0.7,0,0,Math.PI*2);c.fill();
  c.restore();
  // Rechter been (voor)
  c.save();c.translate(tW*0.3,-bL*0.05);c.rotate(bHk*0.7);
  c.beginPath();c.moveTo(0,0);c.lineTo(0,bL);c.stroke();
  c.fillStyle=vG;
  c.beginPath();c.ellipse(-bL*0.12*Math.sin(bHk*0.7),bL+bW*0.4,bW*1.3,bW*0.7,0,0,Math.PI*2);c.fill();
  c.restore();

  // TORSO
  var torsoG=c.createRadialGradient(-tW*0.2,-tH*0.5,0,0,-tH*0.3,tW*1.2);
  torsoG.addColorStop(0,lichten(d.lk,30));torsoG.addColorStop(1,d.lk);
  rr(c,-tW/2,-tH,tW,tH,tW*0.35,null);c.fillStyle=torsoG;c.fill();
  c.strokeStyle=donkeren(d.lk,20);c.lineWidth=1.5;c.stroke();
  // Buik
  var buikG=c.createRadialGradient(0,-tH*0.45,0,0,-tH*0.45,tW*0.5);
  buikG.addColorStop(0,lichten(d.bk,20));buikG.addColorStop(1,d.bk);
  circ(c,0,-tH*0.45,tW*0.36,null);c.fillStyle=buikG;c.fill();

  // ARMEN
  c.lineCap='round';c.strokeStyle=d.lk;c.lineWidth=aW;
  // Links
  c.save();c.translate(-tW*0.52,-tH*0.72);c.rotate(aHk+0.18+bHk*0.4);
  c.beginPath();c.moveTo(0,0);c.lineTo(0,aL);c.stroke();
  circ(c,0,aL,aW*0.65,d.lk);c.restore();
  // Rechts
  c.save();c.translate(tW*0.52,-tH*0.72);c.rotate(-aHk-0.12-bHk*0.4);
  c.beginPath();c.moveTo(0,0);c.lineTo(0,aL);c.stroke();
  circ(c,0,aL,aW*0.65,d.lk);c.restore();

  // HOOFD
  var hY=-tH-hR*0.55;
  // Nek
  rr(c,-hR*0.22,hY+hR*0.3,hR*0.44,hR*0.6,hR*0.1,d.lk,donkeren(d.lk,15),1);

  // Hoofd vorm (type-specifiek)
  var hG=c.createRadialGradient(-hR*0.25,hY-hR*0.3,0,0,hY,hR*1.4);
  hG.addColorStop(0,lichten(d.lk,25));hG.addColorStop(1,d.lk);
  shadow(c,'rgba(0,0,0,0.15)',6);

  if(d.type==='konijn'||d.type==='hamster'){
    // Ronde hoofd
    circ(c,0,hY,hR,null);c.fillStyle=hG;c.fill();
    c.strokeStyle=donkeren(d.lk,20);c.lineWidth=1.5;c.stroke();
    // Wangen puffed (hamster)
    if(d.type==='hamster'){
      circ(c,-hR*0.72,hY+hR*0.15,hR*0.38,d.bk,donkeren(d.bk,15),1);
      circ(c,hR*0.72,hY+hR*0.15,hR*0.38,d.bk,donkeren(d.bk,15),1);
    }
    // Lange oren
    var oorH=hR*1.4,oorW=hR*0.32;
    rr(c,-hR*0.55,hY-hR-oorH+hR*0.3,oorW,oorH,oorW/2,d.ok,donkeren(d.ok,15),1);
    rr(c,hR*0.22,hY-hR-oorH+hR*0.3,oorW,oorH,oorW/2,d.ok,donkeren(d.ok,15),1);
    rr(c,-hR*0.48,hY-hR-oorH+hR*0.35,oorW*0.55,oorH*0.82,oorW*0.28,'#ffb3ba',null);
    rr(c,hR*0.29,hY-hR-oorH+hR*0.35,oorW*0.55,oorH*0.82,oorW*0.28,'#ffb3ba',null);
  } else if(d.type==='uil'){
    // Uil: meer vierkant hoofd
    rr(c,-hR*0.95,hY-hR*0.9,hR*1.9,hR*1.8,hR*0.5,null);c.fillStyle=hG;c.fill();
    c.strokeStyle=donkeren(d.lk,20);c.lineWidth=1.5;c.stroke();
    // Oor-kuifjes
    c.fillStyle=d.ok;
    c.beginPath();c.moveTo(-hR*0.5,hY-hR*0.88);c.lineTo(-hR*0.7,hY-hR*1.4);c.lineTo(-hR*0.25,hY-hR*0.9);c.closePath();c.fill();
    c.beginPath();c.moveTo(hR*0.5,hY-hR*0.88);c.lineTo(hR*0.7,hY-hR*1.4);c.lineTo(hR*0.25,hY-hR*0.9);c.closePath();c.fill();
    // Gezichtsschijf
    c.fillStyle=d.bk;c.beginPath();c.ellipse(0,hY,hR*0.82,hR*0.88,0,0,Math.PI*2);c.fill();
  } else if(d.type==='kat'){
    circ(c,0,hY,hR,null);c.fillStyle=hG;c.fill();
    c.strokeStyle=donkeren(d.lk,20);c.lineWidth=1.5;c.stroke();
    // Puntige oren
    c.fillStyle=d.ok;
    c.beginPath();c.moveTo(-hR*0.7,hY-hR*0.6);c.lineTo(-hR*0.45,hY-hR*1.45);c.lineTo(-hR*0.1,hY-hR*0.65);c.closePath();c.fill();
    c.beginPath();c.moveTo(hR*0.7,hY-hR*0.6);c.lineTo(hR*0.45,hY-hR*1.45);c.lineTo(hR*0.1,hY-hR*0.65);c.closePath();c.fill();
    // Binnen oor
    c.fillStyle='#ffb3ba';
    c.beginPath();c.moveTo(-hR*0.6,hY-hR*0.65);c.lineTo(-hR*0.45,hY-hR*1.25);c.lineTo(-hR*0.18,hY-hR*0.7);c.closePath();c.fill();
    c.beginPath();c.moveTo(hR*0.6,hY-hR*0.65);c.lineTo(hR*0.45,hY-hR*1.25);c.lineTo(hR*0.18,hY-hR*0.7);c.closePath();c.fill();
    // Snorren
    c.strokeStyle='rgba(255,255,255,0.7)';c.lineWidth=1.2;c.lineCap='round';
    [[-hR*0.95,hY+hR*0.18,-hR*0.28,hY+hR*0.2],[-hR*0.95,hY+hR*0.28,-hR*0.28,hY+hR*0.25],
     [hR*0.95,hY+hR*0.18,hR*0.28,hY+hR*0.2],[hR*0.95,hY+hR*0.28,hR*0.28,hY+hR*0.25]].forEach(function(l){
      c.beginPath();c.moveTo(l[0],l[1]);c.lineTo(l[2],l[3]);c.stroke();
    });
  } else if(d.type==='panda'){
    circ(c,0,hY,hR,null);c.fillStyle=hG;c.fill();
    c.strokeStyle='#ddd';c.lineWidth=1.5;c.stroke();
    // Ronde oren
    circ(c,-hR*0.68,hY-hR*0.72,hR*0.3,'#222222');
    circ(c,hR*0.68,hY-hR*0.72,hR*0.3,'#222222');
    // Zwarte oogvlekken
    c.fillStyle='#1a1a1a';
    c.beginPath();c.ellipse(-hR*0.3,hY-hR*0.08,hR*0.28,hR*0.22,0.25,0,Math.PI*2);c.fill();
    c.beginPath();c.ellipse(hR*0.3,hY-hR*0.08,hR*0.28,hR*0.22,-0.25,0,Math.PI*2);c.fill();
  } else {
    // Beer, vos, eekhoorn, wasbeer — ronde oren
    circ(c,0,hY,hR,null);c.fillStyle=hG;c.fill();
    c.strokeStyle=donkeren(d.lk,20);c.lineWidth=1.5;c.stroke();
    circ(c,-hR*0.68,hY-hR*0.72,hR*0.3,d.ok,donkeren(d.ok,15),1);
    circ(c,hR*0.68,hY-hR*0.72,hR*0.3,d.ok,donkeren(d.ok,15),1);
    circ(c,-hR*0.68,hY-hR*0.72,hR*0.16,'#ffb3ba');
    circ(c,hR*0.68,hY-hR*0.72,hR*0.16,'#ffb3ba');
    // Snuit
    circ(c,0,hY+hR*0.28,hR*0.4,d.bk,donkeren(d.bk,10),1);
    // Wasbeer masker
    if(d.type==='wasbeer'){
      c.fillStyle='rgba(40,40,40,0.45)';
      c.beginPath();c.ellipse(-hR*0.3,hY-hR*0.08,hR*0.28,hR*0.2,0.2,0,Math.PI*2);c.fill();
      c.beginPath();c.ellipse(hR*0.3,hY-hR*0.08,hR*0.28,hR*0.2,-0.2,0,Math.PI*2);c.fill();
    }
    // Vos-witte mond
    if(d.type==='vos'){
      circ(c,0,hY+hR*0.32,hR*0.28,'white');
    }
  }
  noShadow(c);

  // OGEN (universal, tenzij al getekend)
  if(d.type!=='panda'){
    var oogOffX=d.type==='uil'?hR*0.35:hR*0.3;
    var oogY2=d.type==='uil'?hY+hR*0.08:hY-hR*0.08;
    var oogR=d.type==='uil'?hR*0.22:hR*0.13;
    circ(c,-oogOffX,oogY2,oogR,d.ek);
    circ(c,oogOffX,oogY2,oogR,d.ek);
    // Pupillen
    if(d.type==='uil'){
      circ(c,-oogOffX,oogY2,oogR*0.6,'#1a1a1a');
      circ(c,oogOffX,oogY2,oogR*0.6,'#1a1a1a');
    }
    // Glinstertjes
    circ(c,-oogOffX+oogR*0.28,oogY2-oogR*0.28,oogR*0.3,'white');
    circ(c,oogOffX+oogR*0.28,oogY2-oogR*0.28,oogR*0.3,'white');
  } else {
    // Panda ogen wit op zwart vlak
    circ(c,-hR*0.3,hY-hR*0.08,hR*0.12,'white');
    circ(c,hR*0.3,hY-hR*0.08,hR*0.12,'white');
    circ(c,-hR*0.27,hY-hR*0.11,hR*0.05,'white');
    circ(c,hR*0.33,hY-hR*0.11,hR*0.05,'white');
  }

  // NEUS (type-specifiek)
  if(d.type==='konijn'||d.type==='hamster'){
    circ(c,0,hY+hR*0.2,hR*0.1,d.nk);
    // Gespleten lip
    c.strokeStyle=d.nk;c.lineWidth=1.2;c.lineCap='round';
    c.beginPath();c.moveTo(0,hY+hR*0.3);c.lineTo(0,hY+hR*0.48);c.stroke();
  } else if(d.type==='uil'){
    // Snaveltje
    c.fillStyle='#c87820';
    c.beginPath();c.moveTo(-hR*0.1,hY+hR*0.15);c.lineTo(0,hY+hR*0.35);c.lineTo(hR*0.1,hY+hR*0.15);c.closePath();c.fill();
  } else if(d.type==='kat'){
    c.fillStyle=d.nk;c.beginPath();c.moveTo(-hR*0.08,hY+hR*0.12);c.lineTo(hR*0.08,hY+hR*0.12);c.lineTo(0,hY+hR*0.22);c.closePath();c.fill();
  } else {
    c.fillStyle=d.nk;c.beginPath();c.ellipse(0,hY+hR*0.26,hR*0.18,hR*0.12,0,0,Math.PI*2);c.fill();
    circ(c,-hR*0.06,hY+hR*0.22,hR*0.04,'rgba(255,255,255,0.35)');
  }

  // MOND
  if(d.type!=='uil'){
    c.strokeStyle='rgba(0,0,0,0.35)';c.lineWidth=1.6;c.lineCap='round';
    if(d.type==='kat'){
      c.beginPath();c.moveTo(-hR*0.22,hY+hR*0.35);c.arc(-hR*0.12,hY+hR*0.35,hR*0.1,Math.PI,0);c.stroke();
      c.beginPath();c.moveTo(hR*0.22,hY+hR*0.35);c.arc(hR*0.12,hY+hR*0.35,hR*0.1,0,Math.PI);c.stroke();
    } else {
      c.beginPath();c.arc(0,hY+hR*0.3,hR*0.22,0.1,Math.PI-0.1);c.stroke();
    }
  }

  // WANGEN
  c.fillStyle='rgba(255,150,150,0.28)';
  circ(c,-hR*0.58,hY+hR*0.18,hR*0.2,'rgba(255,150,150,0.28)');
  circ(c,hR*0.58,hY+hR*0.18,hR*0.2,'rgba(255,150,150,0.28)');

  // NAAM LABEL — schaal resetten zodat tekst niet spiegelt
  c.save();
  c.scale(richt, 1); // herstel richting (richt is -1 of 1, dus *richt annuleert de eerder gezette scale)
  c.font='bold '+Math.round(Math.min(13,W*0.032))+'px Nunito';
  c.textAlign='center';
  var lblW=c.measureText(d.nm).width+20;
  var lblY=hY-hR*1.7;
  rr(c,-lblW/2,lblY-14,lblW,19,9,'rgba(0,0,0,0.5)');
  c.fillStyle='white';
  c.fillText(d.nm,0,lblY);
  c.restore();

  c.restore();
}

// Kleur helpers
function lichten(hex,pct){
  var n=parseInt(hex.slice(1),16);
  var r=Math.min(255,((n>>16)&0xff)+pct*2.2|0);
  var g=Math.min(255,((n>>8)&0xff)+pct*2.2|0);
  var b=Math.min(255,(n&0xff)+pct*2.2|0);
  return 'rgb('+r+','+g+','+b+')';
}
function donkeren(hex,pct){
  var n=parseInt(hex.slice(1),16);
  var r=Math.max(0,((n>>16)&0xff)-pct*2|0);
  var g=Math.max(0,((n>>8)&0xff)-pct*2|0);
  var b=Math.max(0,(n&0xff)-pct*2|0);
  return 'rgb('+r+','+g+','+b+')';
}

// KEUKEN CANVAS
// ══════════════════════════════════════════════════
function initKeukenCanvas(){
  var kc=document.getElementById('kc');
  kc.width=W;kc.height=Math.round(Math.min(H*0.44,300));
  kCtx=kc.getContext('2d');
}
function renderKeuken(){
  if(!kCtx)return;
  var c=kCtx;
  var kw=c.canvas.width,kh=c.canvas.height;
  c.clearRect(0,0,kw,kh);

  // Keuken achtergrond
  var bg=c.createLinearGradient(0,0,0,kh);
  bg.addColorStop(0,'#fff9f0');bg.addColorStop(1,'#ffe0b2');
  c.fillStyle=bg;c.fillRect(0,0,kw,kh);
  // Tegels
  c.strokeStyle='rgba(180,140,80,0.18)';c.lineWidth=1;
  var tg=kw/10;
  for(var ti=0;ti<=10;ti++){c.beginPath();c.moveTo(ti*tg,0);c.lineTo(ti*tg,kh);c.stroke();}
  for(var tj=0;tj<=6;tj++){c.beginPath();c.moveTo(0,tj*kh/6);c.lineTo(kw,tj*kh/6);c.stroke();}
  // Aanrecht
  var ax=kw*0.04,ay=kh*0.18,aw=kw*0.92,ah=kh*0.6;
  var aanG=c.createLinearGradient(ax,ay,ax,ay+ah);
  aanG.addColorStop(0,'#e8f5e9');aanG.addColorStop(0.7,'#c8e6c9');aanG.addColorStop(1,'#a5d6a7');
  rr(c,ax,ay,aw,ah,14,null);c.fillStyle=aanG;c.fill();
  c.strokeStyle='#81c784';c.lineWidth=3;c.stroke();
  // Glans aanrecht
  c.fillStyle='rgba(255,255,255,0.35)';
  rr(c,ax+4,ay+4,aw-8,ah*0.1,10,'rgba(255,255,255,0.35)');
  // Onderkast
  rr(c,ax,ay+ah,aw,kh*0.2,0,'#8d6e63','#5d4037',2);
  // Kast deurtjes
  for(var ki=0;ki<3;ki++){
    rr(c,ax+aw*0.03+ki*(aw*0.32),ay+ah+kh*0.02,aw*0.3,kh*0.15,6,'#7d5c4a','#5d4037',1.5);
    circ(c,ax+aw*0.18+ki*(aw*0.32),ay+ah+kh*0.1,kh*0.02,'#d4a870');
  }

  var stap=kStappen[kStap];
  if(!stap)return;
  if(stap.scene==='snij')           tekenSnijSceneK(c,kw,kh,ay,stap);
  else if(stap.scene==='blend')     tekenBlendSceneK(c,kw,kh,ay,stap);
  else if(stap.scene==='glas')      tekenGlasSceneK(c,kw,kh,ay,stap);
  else if(stap.scene==='klaar')     tekenKlaarSceneK(c,kw,kh,ay,stap);
  else if(stap.scene==='ijs_init')  tekenIjsMachineScene(c,kw,kh,ay,stap,false);
  else if(stap.scene==='ijs_schep') tekenIjsSchepScene(c,kw,kh,ay,stap);
  else if(stap.scene==='ijs_topping')tekenIjsToppingScene(c,kw,kh,ay,stap);
  else if(stap.scene==='ijs_klaar') tekenIjsKlaarScene(c,kw,kh,ay,stap);
}

function tekenSnijSceneK(c,kw,kh,ay,stap){
  // Snijplank
  var bx=kw*0.22,by=ay+kh*0.06,bw=kw*0.56,bh=kh*0.44;
  var plG=c.createLinearGradient(bx,by,bx,by+bh);
  plG.addColorStop(0,'#d4a574');plG.addColorStop(1,'#c8956a');
  rr(c,bx,by,bw,bh,10,null);c.fillStyle=plG;c.fill();
  c.strokeStyle='#b8855a';c.lineWidth=2;c.stroke();
  // Snijgroeven
  c.strokeStyle='rgba(150,100,50,0.22)';c.lineWidth=1;
  for(var gi=1;gi<5;gi++){c.beginPath();c.moveTo(bx+bw*gi/5,by+6);c.lineTo(bx+bw*gi/5,by+bh-6);c.stroke();}
  for(var gj=1;gj<3;gj++){c.beginPath();c.moveTo(bx+6,by+bh*gj/3);c.lineTo(bx+bw-6,by+bh*gj/3);c.stroke();}

  var ing=INGREDIENTEN.find(function(i){return i.id===stap.ingId;});
  if(!ing)return;
  var cx=bx+bw*0.5,cy=by+bh*0.5;
  var ns=stap.stukjes||0;

  if(ns===0){
    tekenFruitGrootK(c,cx,cy,ing,kh*0.13,kh);
    tekenMesK(c,bx+bw*0.82,by-kh*0.06,kh);
  } else {
    var posities=[];
    for(var si=0;si<Math.min(ns,8);si++){
      posities.push({x:bx+bw*(0.14+si%4*0.24),y:by+bh*(0.2+Math.floor(si/4)*0.5)});
    }
    posities.forEach(function(p,i){
      tekenFruitStukjeK(c,p.x,p.y,ing,kh*0.07,i);
    });
    tekenMesK(c,cx+bw*0.12,by-kh*0.07,kh);
    // Sap spatters
    c.fillStyle=ing.kl+'80';
    for(var sp=0;sp<6;sp++){
      circ(c,bx+bw*(0.2+sp*0.14),by+bh*0.55+sp*3,3+sp*1.2,ing.kl+'60');
    }
  }
}

function tekenFruitGrootK(c,x,y,ing,r,kh){
  if(ing.id==='banaan'){
    c.strokeStyle='#ffd700';c.lineWidth=r*1.4;c.lineCap='round';
    c.beginPath();c.arc(x,y+r*0.2,r*1.2,Math.PI*1.05,Math.PI*0.02);c.stroke();
    c.fillStyle='#fff3a0';c.beginPath();c.ellipse(x-r*0.05,y+r*0.1,r*0.25,r*0.65,0.15,0,Math.PI*2);c.fill();
    c.fillStyle='#8B6914';circ(c,x-r*1.1,y+r*0.65,r*0.12,'#8B6914');
    circ(c,x+r*0.9,y-r*0.75,r*0.1,'#8B6914');
  } else if(ing.id==='aardbei'){
    c.fillStyle=ing.kl;
    c.beginPath();c.moveTo(x,y-r);c.quadraticCurveTo(x+r*1.1,y-r*0.2,x+r*0.8,y+r*0.5);
    c.quadraticCurveTo(x,y+r,x-r*0.8,y+r*0.5);c.quadraticCurveTo(x-r*1.1,y-r*0.2,x,y-r);c.closePath();c.fill();
    c.fillStyle=donkeren(ing.kl,20);c.beginPath();c.ellipse(x,y+r*0.1,r*0.7,r*0.65,0,0,Math.PI*2);c.fill();
    c.fillStyle='#2e7d32';c.font=Math.round(r*0.7)+'px serif';c.textAlign='center';c.fillText('🌿',x,y-r*0.7);
    c.fillStyle='rgba(255,255,255,0.25)';
    for(var di2=0;di2<8;di2++){c.font=Math.round(r*0.18)+'px serif';c.fillText('·',x+Math.cos(di2*0.8)*r*0.55,y+Math.sin(di2*0.8)*r*0.5);}
  } else if(ing.id==='watermeloen'){
    circ(c,x,y,r,'#2e7d32',donkeren('#2e7d32',15),2);
    c.strokeStyle='#4caf50';c.lineWidth=1.5;
    for(var wi=0;wi<4;wi++){c.beginPath();c.arc(x,y,r,wi*Math.PI*0.5,wi*Math.PI*0.5+0.3);c.stroke();}
    circ(c,x,y,r*0.86,'#ef5350');
    circ(c,x,y,r*0.78,'#e53935');
    c.fillStyle='#1a1a1a';
    for(var si3=0;si3<5;si3++){circ(c,x+Math.cos(si3*1.2)*r*0.45,y+Math.sin(si3*1.2)*r*0.4,r*0.05,'#1a1a1a');}
    c.fillStyle='rgba(255,255,255,0.3)';circ(c,x-r*0.35,y-r*0.35,r*0.25,'rgba(255,255,255,0.3)');
  } else if(ing.id==='ananas'){
    c.fillStyle='#fdd835';
    c.beginPath();c.ellipse(x,y+r*0.15,r*0.72,r*1.05,0,0,Math.PI*2);c.fill();
    c.strokeStyle='#f9a825';c.lineWidth=1.5;
    for(var ai2=0;ai2<12;ai2++){
      c.beginPath();c.moveTo(x,y+r*0.15);
      c.arc(x,y+r*0.15,r*0.68,ai2*Math.PI/6,ai2*Math.PI/6+Math.PI/6);c.stroke();
    }
    c.fillStyle='#2e7d32';c.font=Math.round(r*0.8)+'px serif';c.textAlign='center';c.fillText('🌿',x,y-r*0.9);
    c.fillStyle='rgba(255,255,255,0.25)';circ(c,x-r*0.3,y-r*0.3,r*0.25,'rgba(255,255,255,0.25)');
  } else if(ing.id==='citroen'||ing.id==='peer'||ing.id==='appel'){
    var kleurTop=ing.id==='appel'?'#e53935':ing.id==='peer'?'#aed581':'#fdd835';
    circ(c,x,y,r,kleurTop,donkeren(kleurTop,15),2);

function tekenFruitStukjeK(c,x,y,ing,r,idx){

    c.strokeStyle='#1b5e20';c.lineWidth=1;c.stroke();
    c.fillStyle='#1a1a1a';for(var bj=0;bj<3;bj++)circ(c,-r*0.4+bj*r*0.4,r*0.4,r*0.07,'#1a1a1a');
    c.fillStyle='rgba(255,255,255,0.3)';circ(c,-r*0.4,r*0.3,r*0.2,'rgba(255,255,255,0.3)');

    c.beginPath();c.moveTo(0,0);c.arc(0,0,r,-Math.PI*0.65,Math.PI*0.65);c.closePath();c.fill();

    // Sap lijn
    c.strokeStyle='rgba(255,255,255,0.4)';c.lineWidth=1;
    c.beginPath();c.moveTo(-r*0.05,-r*0.7);c.lineTo(-r*0.1,r*0.7);c.stroke();

}

function tekenBlendSceneK(c,kw,kh,ay,stap){
  var bx=kw*0.28,by=ay+kh*0.01,bw=kw*0.44,bh=kh*0.5;

  var basG=c.createLinearGradient(bx+bw*0.1,by+bh*0.88,bx+bw*0.9,by+bh);
  basG.addColorStop(0,'#546e7a');basG.addColorStop(1,'#37474f');
  rr(c,bx+bw*0.08,by+bh*0.86,bw*0.84,bh*0.18,8,null);c.fillStyle=basG;c.fill();
  c.strokeStyle='#263238';c.lineWidth=2;c.stroke();
  // Knoppen
  var kknl=['#ef5350','#42a5f5','#66bb6a'];
  kknl.forEach(function(kk,ki){
    var active=ki===0&&blFase===2;

  // Kan lichaam
  c.beginPath();c.moveTo(-bw*0.36,0);c.lineTo(bw*0.36,0);
  c.lineTo(bw*0.26,-bh*0.82);c.lineTo(-bw*0.26,-bh*0.82);c.closePath();
  var kanG=c.createLinearGradient(-bw*0.36,-bh*0.82,bw*0.36,0);
  kanG.addColorStop(0,'rgba(207,227,242,0.4)');kanG.addColorStop(0.5,'rgba(227,242,252,0.55)');kanG.addColorStop(1,'rgba(207,227,242,0.4)');
  c.fillStyle=kanG;c.fill();
  c.strokeStyle='rgba(180,210,240,0.65)';c.lineWidth=3;c.stroke();
  // Glans
  c.fillStyle='rgba(255,255,255,0.18)';
  c.beginPath();c.moveTo(-bw*0.36,0);c.lineTo(-bw*0.22,-bh*0.82);c.lineTo(-bw*0.12,-bh*0.82);c.lineTo(-bw*0.26,0);c.closePath();c.fill();
  // Tuit
  c.fillStyle='rgba(207,227,242,0.4)';
  c.beginPath();c.moveTo(-bw*0.26,-bh*0.82);c.lineTo(-bw*0.4,-bh*0.88);c.lineTo(-bw*0.38,-bh*0.96);c.lineTo(-bw*0.24,-bh*0.82);c.closePath();c.fill();
  c.strokeStyle='rgba(180,210,240,0.6)';c.lineWidth=2;c.stroke();

  // Inhoud
  if(blInhoud.length>0){
    var vulH=Math.min(bh*0.68,bh*0.18*blInhoud.length);
    var inhGg=c.createLinearGradient(0,-vulH,0,0);
    var k1=INGREDIENTEN.find(function(i){return i.id===blInhoud[0];});
    var k2=blInhoud.length>1?INGREDIENTEN.find(function(i){return i.id===blInhoud[1];}):k1;
    inhGg.addColorStop(0,k1?k1.kl+'bb':'#ff9800bb');
    inhGg.addColorStop(1,k2?k2.kl+'dd':'#ff9800dd');
    c.beginPath();c.moveTo(-bw*0.33,-vulH);c.lineTo(bw*0.33,-vulH);
    c.lineTo(bw*0.27,-bh*0.01);c.lineTo(-bw*0.27,-bh*0.01);c.closePath();
    c.fillStyle=inhGg;c.globalAlpha=0.82;c.fill();c.globalAlpha=1;
    // Bubbels
    if(blFase===2){
      for(var bi2=0;bi2<10;bi2++){
        var bax=-bw*0.28+Math.random()*bw*0.56;
        var bay=-vulH*0.15-Math.random()*vulH*0.75;
        circ(c,bax,bay,2+Math.random()*4,'rgba(255,255,255,0.5)');
      }
      // Spat
      c.fillStyle='rgba(255,255,255,0.15)';
      c.beginPath();c.arc(0,-vulH,bw*0.35+Math.sin(T*0.3)*bw*0.05,Math.PI,0);c.fill();
    }
  }
  // Mesblad
  c.save();c.rotate(blRot);
  c.strokeStyle='rgba(176,190,197,0.9)';c.lineWidth=4;c.lineCap='round';
  c.beginPath();c.moveTo(-bw*0.24,-bh*0.04);c.lineTo(bw*0.24,-bh*0.04);c.stroke();
  c.beginPath();c.moveTo(0,-bh*0.04-bw*0.24);c.lineTo(0,-bh*0.04+bw*0.24);c.stroke();
  // Schroef
  circ(c,0,-bh*0.04,bw*0.06,'#90a4ae','#607d8b',2);
  c.restore();

  c.restore();

  // Ingrediënten aan de zijkant wachtend
  if(stap.fase===0&&stap.wachtIng){
    stap.wachtIng.forEach(function(id,i){
      var ing=INGREDIENTEN.find(function(x){return x.id===id;});
      if(ing)tekenFruitGrootK(c,bx-bw*0.1-i*kw*0.07,by+bh*0.4+i*kh*0.06,ing,kh*0.06,kh);
    });
  }
}

function tekenGlasSceneK(c,kw,kh,ay,stap){

  glasG2.addColorStop(0.4,'rgba(230,245,255,0.5)');
  glasG2.addColorStop(1,'rgba(200,235,255,0.3)');
  c.fillStyle=glasG2;c.fill();

    c.fillStyle=vulG2;c.fill();

    c.beginPath();c.ellipse(gx2+gw*0.5,fyTop+2,gw*0.38*(0.15+vp*0.85),6,0,0,Math.PI*2);c.fill();
    // Bubbels
    c.fillStyle='rgba(255,255,255,0.4)';
    for(var bub=0;bub<5;bub++){
      circ(c,gx2+gw*(0.2+bub*0.14),fyTop+gh*vp*0.4+Math.sin(T*0.12+bub)*8,2+bub,'rgba(255,255,255,0.4)');
    }

  // Rietje

  // Citroen schijf
  circ(c,gx2+gw*0.26,gy+8,gw*0.18,'#fdd835','#f9a825',2);
  c.strokeStyle='#f9a825';c.lineWidth=1;
  c.beginPath();c.moveTo(gx2+gw*0.26,gy+8-gw*0.18);c.lineTo(gx2+gw*0.26,gy+8+gw*0.18);c.stroke();
  c.beginPath();c.moveTo(gx2+gw*0.26-gw*0.18,gy+8);c.lineTo(gx2+gw*0.26+gw*0.18,gy+8);c.stroke();

  // Blender giet
  if(vp<0.9){
    c.save();c.translate(kw*0.28,ay+kh*0.04);c.rotate(Math.PI*0.22);
    c.fillStyle='rgba(200,230,255,0.15)';
    c.beginPath();c.moveTo(-20,0);c.lineTo(20,0);c.lineTo(14,-55);c.lineTo(-14,-55);c.closePath();c.fill();
    c.strokeStyle='rgba(200,230,255,0.5)';c.lineWidth=2;c.stroke();
    if(smootje){
      c.strokeStyle=smootje.kl;c.lineWidth=5;c.lineCap='round';

      c.bezierCurveTo(10,30,gx2*0.12,ay*0.4,gx2*0.55,gy+10);c.stroke();
    }
    c.restore();
  }
}

function tekenKlaarSceneK(c,kw,kh,ay,stap){

// ══════════════════════════════════════════════════
// SNIJ MINIGAME
// ══════════════════════════════════════════════════
var snijItemsArr=[],snijGesnedenN=0,snijCbFn=null;
var snijTeken=false,snijLastP=null,snijCtx2=null;

function initSnij(ingId){
  var sc=document.getElementById('snijC');
  var sz=Math.min(W*0.82,320);
  sc.width=sz;sc.height=sz;
  snijCtx2=sc.getContext('2d');
  snijGesnedenN=0;snijItemsArr=[];
  var ing=INGREDIENTEN.find(function(i){return i.id===ingId;});
  document.getElementById('snij-top').textContent='✂️ Veeg over de '+(ing?ing.nm:'fruit')+' om te snijden!';
  document.getElementById('snijv').style.width='0%';

  var n=4+Math.floor(Math.random()*3);
  for(var i=0;i<n;i++){
    snijItemsArr.push({id:ingId,x:40+Math.random()*(sz-80),y:40+Math.random()*(sz-80),r:28+Math.random()*16,gsn:false,hoek:Math.random()*Math.PI*2});
  }
  renderSnij();

  if(!sc._initDone){
    sc._initDone=true;
    sc.ontouchstart=function(e){e.preventDefault();snijTeken=true;snijLastP=sTPos(e.touches[0]);renderSnij();};
    sc.ontouchmove=function(e){e.preventDefault();if(!snijTeken)return;var p=sTPos(e.touches[0]);snijMv(p);snijLastP=p;};
    sc.ontouchend=function(){snijTeken=false;snijLastP=null;};
    sc.onmousedown=function(e){snijTeken=true;snijLastP=sMPos(e);};
    sc.onmousemove=function(e){if(!snijTeken)return;var p=sMPos(e);snijMv(p);snijLastP=p;};
    sc.onmouseup=function(){snijTeken=false;};
  }
  document.getElementById('snij').classList.add('open');
}

function sTPos(t){var r=document.getElementById('snijC').getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top};}
function sMPos(e){var r=document.getElementById('snijC').getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}

function snijMv(p){
  snijItemsArr.forEach(function(item){
    if(item.gsn)return;
    var dx=p.x-item.x,dy=p.y-item.y;
    if(Math.sqrt(dx*dx+dy*dy)<item.r+8){
      item.gsn=true;snijGesnedenN++;
      speelSnijGeluid();
      document.getElementById('snijv').style.width=(snijGesnedenN/snijItemsArr.length*100)+'%';
    }
  });
  renderSnij();
  if(snijGesnedenN>=snijItemsArr.length){
    setTimeout(function(){document.getElementById('snij').classList.remove('open');if(snijCbFn){snijCbFn();snijCbFn=null;}},500);
  }
}

function renderSnij(){
  var c=snijCtx2;if(!c)return;
  var sz=c.canvas.width;
  c.clearRect(0,0,sz,sz);
  // Snijplank
  var plG=c.createLinearGradient(0,0,0,sz);
  plG.addColorStop(0,'#d4a574');plG.addColorStop(1,'#b8855a');
  rr(c,0,0,sz,sz,16,null);c.fillStyle=plG;c.fill();
  c.strokeStyle='rgba(150,100,50,0.4)';c.lineWidth=1.5;
  for(var i=1;i<6;i++){c.beginPath();c.moveTo(sz/6*i,5);c.lineTo(sz/6*i,sz-5);c.stroke();}
  for(var j=1;j<4;j++){c.beginPath();c.moveTo(5,sz/4*j);c.lineTo(sz-5,sz/4*j);c.stroke();}
  // Schaduw rand
  var sdG=c.createLinearGradient(0,0,20,20);
  sdG.addColorStop(0,'rgba(0,0,0,0.15)');sdG.addColorStop(1,'rgba(0,0,0,0)');
  rr(c,0,0,sz,sz,16,null);c.fillStyle=sdG;c.fill();

  snijItemsArr.forEach(function(item){
    var ing=INGREDIENTEN.find(function(i){return i.id===item.id;});
    if(!ing)return;
    if(!item.gsn){
      shadow(c,'rgba(0,0,0,0.2)',8);
      tekenFruitGrootK(c,item.x,item.y,ing,item.r,sz);
      noShadow(c);
      // Highlight ring
      c.strokeStyle='rgba(255,255,255,0.35)';c.lineWidth=2;
      c.beginPath();c.arc(item.x,item.y,item.r+4,0,Math.PI*2);c.stroke();
    } else {
      var off=15+snijGesnedenN*1.5;
      c.save();c.translate(item.x-off*0.7,item.y-off*0.4);c.rotate(-0.35);
      tekenFruitStukjeK(c,0,0,ing,item.r*0.78,0);c.restore();
      c.save();c.translate(item.x+off*0.7,item.y+off*0.4);c.rotate(0.35);
      tekenFruitStukjeK(c,0,0,ing,item.r*0.78,1);c.restore();
      // Sap spatters
      c.fillStyle=ing.kl+'70';
      for(var si=0;si<6;si++){
        var sx=item.x+Math.cos(si*1.05)*item.r*(0.8+si*0.15);
        var sy=item.y+Math.sin(si*1.05)*item.r*(0.8+si*0.15);
        circ(c,sx,sy,3+si*0.8,ing.kl+'70');
      }
      // Mes snijlijn
      c.strokeStyle='rgba(255,255,255,0.5)';c.lineWidth=2;
      c.beginPath();c.moveTo(item.x-item.r,item.y+off*0.1);c.lineTo(item.x+item.r,item.y-off*0.1);c.stroke();
    }
  });

  // Mes cursor
  if(snijLastP){
    c.save();c.translate(snijLastP.x-5,snijLastP.y-5);c.rotate(-Math.PI*0.2);
    tekenMesK(c,0,0,sz);c.restore();
  }
}

function speelSnijGeluid(){
  try{var ac=new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator();var g=ac.createGain();
    o.connect(g);g.connect(ac.destination);o.frequency.setValueAtTime(600+Math.random()*500,ac.currentTime);
    g.gain.setValueAtTime(0.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.1);
    o.start();o.stop(ac.currentTime+0.1);}catch(e){}
}

function speelGeluid(type){
  try{var ac=new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator();var g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    if(type==='goed'){o.frequency.setValueAtTime(523,ac.currentTime);o.frequency.setValueAtTime(659,ac.currentTime+0.12);o.frequency.setValueAtTime(784,ac.currentTime+0.24);g.gain.setValueAtTime(0.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.6);o.start();o.stop(ac.currentTime+0.6);}
    else if(type==='blend'){o.type='sawtooth';o.frequency.setValueAtTime(80,ac.currentTime);o.frequency.linearRampToValueAtTime(250,ac.currentTime+0.9);g.gain.setValueAtTime(0.14,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+1);o.start();o.stop(ac.currentTime+1);}
    else if(type==='bel'){o.frequency.setValueAtTime(880,ac.currentTime);o.frequency.setValueAtTime(1100,ac.currentTime+0.08);g.gain.setValueAtTime(0.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.4);o.start();o.stop(ac.currentTime+0.4);}
    else{o.frequency.setValueAtTime(440,ac.currentTime);g.gain.setValueAtTime(0.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.15);o.start();o.stop(ac.currentTime+0.15);}}
  catch(e){}
}

var ijsMachineAan=false,ijsSchepProg=0,ijsToppingsGedaan=[];

function renderIjsKeuken(c,kw,kh,ay,stap){
  if(!stap)return;
  if(stap.scene==='ijs_init') tekenIjsMachineScene(c,kw,kh,ay,stap,false);
  else if(stap.scene==='ijs_schep') tekenIjsSchepScene(c,kw,kh,ay,stap);
  else if(stap.scene==='ijs_topping') tekenIjsToppingScene(c,kw,kh,ay,stap);
  else if(stap.scene==='ijs_klaar') tekenIjsKlaarScene(c,kw,kh,ay,stap);
}

function tekenIjsMachineScene(c,kw,kh,ay,stap,aan){
  // Werkblad decoraties
  var mw=kw*0.55,mx=kw*0.22,my=ay+kh*0.04;
  
  // IJSmachine body - groot en realistisch
  var mh=kh*0.72;
  // Machine behuizing
  var machG=c.createLinearGradient(mx,my,mx+mw,my+mh);
  machG.addColorStop(0,'#e0e0e0');machG.addColorStop(0.3,'#f5f5f5');machG.addColorStop(1,'#bdbdbd');
  shadow(c,'rgba(0,0,0,0.2)',14);
  rr(c,mx,my,mw,mh,16,null);c.fillStyle=machG;c.fill();
  c.strokeStyle='#9e9e9e';c.lineWidth=3;c.stroke();
  noShadow(c);

  // Machine glans
  c.fillStyle='rgba(255,255,255,0.25)';
  rr(c,mx+6,my+6,mw*0.18,mh*0.55,8,'rgba(255,255,255,0.25)');

  // Kleur panelen per smaak
  var smkl=gekozenSmaak?gekozenSmaak.kl2:'#9e9e9e';
  rr(c,mx+mw*0.08,my+mh*0.06,mw*0.84,mh*0.22,8,smkl,'#9e9e9e',2);
  // Smaak label op paneel
  c.fillStyle='rgba(255,255,255,0.9)';
  c.font='bold '+Math.round(kh*0.062)+'px Nunito';c.textAlign='center';
  c.fillText(gekozenSmaak?gekozenSmaak.em+' '+gekozenSmaak.nm:'🍨 Ijs',mx+mw*0.5,my+mh*0.2);

  // Display scherm
  rr(c,mx+mw*0.1,my+mh*0.32,mw*0.5,mh*0.18,6,'#1a2a1a','#0a1a0a',2);
  // LCD effect
  c.fillStyle=aan?'#00ff44':'#003300';
  c.font='bold '+Math.round(kh*0.045)+'px Nunito';c.textAlign='center';
  c.fillText(aan?'KLAAR ✓':'STAND-BY',mx+mw*0.35,my+mh*0.43);
  // Groen knipperend lichtje
  if(aan){
    var p2=0.6+0.4*Math.sin(T*0.15);
    shadow(c,'rgba(0,255,68,0.8)',8*p2);
    circ(c,mx+mw*0.68,my+mh*0.4,kh*0.022,'#00ff44');
    noShadow(c);
  } else {
    circ(c,mx+mw*0.68,my+mh*0.4,kh*0.022,'#333333');
  }

  // Knoppen rij
  var knpkl=['#f44336','#ff9800','#4caf50'];
  ['STOP','MED','AAN'].forEach(function(lbl,i){
    var kx=mx+mw*(0.12+i*0.26),ky=my+mh*0.56;
    var kw2=mw*0.2,kh2=kh*0.09;
    var active=(i===2&&aan)||(i===0&&!aan);
    shadow(c,active?knpkl[i]:'transparent',active?8:0);
    rr(c,kx,ky,kw2,kh2,kh2/2,knpkl[i],'rgba(0,0,0,0.3)',2);
    noShadow(c);
    // Knop glans
    c.fillStyle='rgba(255,255,255,0.3)';
    rr(c,kx+3,ky+3,kw2-6,kh2*0.4,kh2*0.2,'rgba(255,255,255,0.3)');
    c.fillStyle='white';c.font='bold '+Math.round(kh*0.036)+'px Nunito';c.textAlign='center';
    c.fillText(lbl,kx+kw2/2,ky+kh2*0.67);
  });

  // IJsmachine tap/tuit
  var tx=mx+mw*0.4,ty=my+mh*0.74,tw2=mw*0.2,th2=kh*0.1;
  rr(c,tx,ty,tw2,th2*0.6,4,'#bdbdbd','#9e9e9e',2);
  // Tuit
  c.fillStyle='#9e9e9e';
  c.beginPath();c.moveTo(tx+tw2*0.25,ty+th2*0.6);c.lineTo(tx+tw2*0.75,ty+th2*0.6);
  c.lineTo(tx+tw2*0.65,ty+th2*1.0);c.lineTo(tx+tw2*0.35,ty+th2*1.0);c.closePath();c.fill();
  c.strokeStyle='#757575';c.lineWidth=1.5;c.stroke();

  // Hendel
  rr(c,tx+tw2*0.72,ty+th2*0.08,mw*0.1,th2*0.44,4,'#e0e0e0','#9e9e9e',2);

  // Als machine aan: ijs stroomt naar hoorntje
  if(aan&&gekozenSmaak){
    var smaakKl=gekozenSmaak.kl;
    var dropPct=Math.min(1,(T%80)/50);
    // Spiraal soft-serve stroom
    c.strokeStyle=smaakKl;c.lineWidth=mw*0.07;c.lineCap='round';
    c.beginPath();
    var tuitX=tx+tw2*0.5, tuitY2=ty+th2;
    c.moveTo(tuitX,tuitY2);
    for(var ds=0;ds<8*dropPct;ds++){
      var dang=ds*0.8, drad=mw*0.018, dy=ds*kh*0.018;
      c.lineTo(tuitX+Math.cos(dang)*drad, tuitY2+dy+Math.sin(dang)*drad*0.4);
    }
    c.stroke();
    // Druppel aan het einde
    if(dropPct>0.5){
      circ(c,tuitX,tuitY2+8*kh*0.018*dropPct,mw*0.04,smaakKl);
    }
  }

  // Bak/schaaltje onderaan
  var bkx=mx+mw*0.28,bky=my+mh+kh*0.02,bkw=mw*0.44,bkh=kh*0.1;
  tekenIjsBak(c,bkx,bky,bkw,bkh,0,[]);
}

function tekenIjsHoorntje(c,hx,hy,hw,hh){
  // Hoorntje (wafelkegel)
  var hG=c.createLinearGradient(hx-hw/2,hy,hx+hw/2,hy+hh);
  hG.addColorStop(0,'#f9a825');hG.addColorStop(0.5,'#e65100');hG.addColorStop(1,'#bf360c');
  c.beginPath();c.moveTo(hx-hw/2,hy);c.lineTo(hx+hw/2,hy);c.lineTo(hx,hy+hh);c.closePath();
  c.fillStyle=hG;c.fill();
  c.strokeStyle='#bf360c';c.lineWidth=1.5;c.stroke();
  // Wafelpatroon
  c.strokeStyle='rgba(150,60,0,0.35)';c.lineWidth=1;
  var steps=6;
  for(var wi=1;wi<steps;wi++){
    var wy=hy+hh*wi/steps;
    var wx=hw/2*(1-wi/steps);
    c.beginPath();c.moveTo(hx-wx,wy);c.lineTo(hx+wx,wy);c.stroke();
  }
  for(var di=0;di<steps;di++){
    var t2=di/steps;
    var t3=(di+1)/steps;
    var x1=hx-hw/2*(1-t2), y1=hy+hh*t2;
    var x2=hx, y2=hy+hh;
    var frac=t2/(1-t2+0.001);
    c.beginPath();c.moveTo(hx-hw/2+di*(hw/steps),hy);c.lineTo(hx,hy+hh);c.stroke();
    c.beginPath();c.moveTo(hx+hw/2-di*(hw/steps),hy);c.lineTo(hx,hy+hh);c.stroke();
  }
  // Glans
  c.fillStyle='rgba(255,200,100,0.25)';
  c.beginPath();c.moveTo(hx-hw*0.35,hy);c.lineTo(hx-hw*0.05,hy);c.lineTo(hx-hw*0.1,hy+hh*0.6);c.closePath();c.fill();
  // Rand bovenaan hoorntje
  c.strokeStyle='#e65100';c.lineWidth=2.5;
  c.beginPath();c.moveTo(hx-hw/2,hy);c.lineTo(hx+hw/2,hy);c.stroke();
}

function tekenIjsSchepje(c,x,y,r,smaak,idx){
  // Drop-shadow
  c.fillStyle='rgba(0,0,0,0.13)';
  c.beginPath();c.ellipse(x+2,y+r*0.18,r*0.8,r*0.2,0,0,Math.PI*2);c.fill();
  // Ijs bol — radiale gradient voor 3D effect
  var schG=c.createRadialGradient(x-r*0.32,y-r*0.32,r*0.05,x,y,r*1.05);
  schG.addColorStop(0,lichten(smaak.kl,35));
  schG.addColorStop(0.45,smaak.kl);
  schG.addColorStop(0.85,donkeren(smaak.kl,18));
  schG.addColorStop(1,donkeren(smaak.kl,30));
  circ(c,x,y,r,null);c.fillStyle=schG;c.fill();
  c.strokeStyle='rgba(0,0,0,0.07)';c.lineWidth=1.2;c.stroke();
  // Hoofd-glans (grote ovaal)
  c.save();
  c.beginPath();c.ellipse(x-r*0.28,y-r*0.26,r*0.38,r*0.25,Math.PI*0.3,0,Math.PI*2);
  c.fillStyle='rgba(255,255,255,0.48)';c.fill();
  // Klein glansje
  c.beginPath();c.ellipse(x-r*0.14,y-r*0.38,r*0.14,r*0.1,0.4,0,Math.PI*2);
  c.fillStyle='rgba(255,255,255,0.3)';c.fill();
  c.restore();
  // Textuur per smaak
  if(smaak.id==='vanille'){
    // Vanille zaadjes
    c.fillStyle='rgba(160,120,30,0.35)';
    [[-0.15,0.1],[0.2,-0.05],[-0.05,0.28],[0.25,0.2],[-0.28,-0.05],[0.05,-0.22]].forEach(function(p){
      c.save();c.translate(x+p[0]*r,y+p[1]*r);c.rotate(Math.random()*Math.PI);
      c.fillRect(-r*0.04,-r*0.01,r*0.08,r*0.02);c.restore();
    });
  } else if(smaak.id==='chocolade'){
    // Chocolade vlekken
    c.fillStyle='rgba(20,5,0,0.22)';
    [[-0.22,-0.08],[0.18,0.12],[-0.08,0.28],[0.32,-0.18],[-0.3,0.15],[0.05,-0.28]].forEach(function(p){
      c.beginPath();c.ellipse(x+p[0]*r,y+p[1]*r,r*0.13,r*0.09,p[0]*2,0,Math.PI*2);c.fill();
    });
    // Choco glans ribbe
    c.strokeStyle='rgba(255,180,100,0.12)';c.lineWidth=2;
    c.beginPath();c.arc(x,y,r*0.65,Math.PI*0.8,Math.PI*1.4);c.stroke();
  } else if(smaak.id==='aardbei'){
    // Aardbei vlekjes
    c.fillStyle='rgba(160,0,30,0.22)';
    [[-0.2,0.05],[0.22,-0.1],[-0.05,0.3],[0.28,0.18],[-0.3,-0.08]].forEach(function(p){
      c.beginPath();c.arc(x+p[0]*r,y+p[1]*r,r*0.07,0,Math.PI*2);c.fill();
    });
    // Aardbei-zaadjes als kleine gele stipjes
    c.fillStyle='rgba(255,240,100,0.45)';
    [[-0.12,0.18],[0.15,0.05],[0.0,0.32],[-0.25,0.02],[0.28,0.22]].forEach(function(p){
      c.beginPath();c.arc(x+p[0]*r,y+p[1]*r,r*0.04,0,Math.PI*2);c.fill();
    });
  }
}

function tekenIjsHoorntjeMetSchepjes(c,cx,baseY,r,schepjes,toppings,kh){
  var hw=r*2.2, hh=r*2.8;
  var hy=baseY-hh;
  // Hoorntje tekenen
  tekenIjsHoorntje(c,cx,hy,hw,hh);
  // Schepjes tekenen (van onder naar boven, licht overlappend)
  var n=Math.min(schepjes,3);
  for(var i=0;i<n;i++){
    var sy=hy - r*0.6 - i*(r*1.55);
    var sx=cx + (i===1?r*0.12:i===2?-r*0.1:0); // kleine verschuiving voor realistisch effect
    tekenIjsSchepje(c,sx,sy,r,gekozenSmaak,i);
  }
  if(n===0)return;
  // Sausdruppels
  var topY=hy - r*0.6 - (n-1)*r*1.55 - r;
  toppings.forEach(function(tid){
    var t=IJS_TOPPINGS.find(function(x){return x.id===tid;});
    if(!t)return;
    if(tid==='slagroom'){
      tekenSlagroomSwirl(c,cx+r*0.1,topY-r*0.3,r*0.75);
    } else if(tid==='kers'){
      tekenKers(c,cx+r*0.4,topY-r*0.8,r*0.32);
    } else if(tid==='aardbeisaus'||tid==='caramelsaus'){
      // Saus druppelt over de bolletjes
      for(var si2=0;si2<n;si2++){
        var dripY=hy-r*0.6-si2*r*1.55;
        var dripX=cx+r*(si2%2===0?0.5:-0.5);
        c.strokeStyle=t.kl+'cc';c.lineWidth=r*0.18;c.lineCap='round';
        c.beginPath();c.moveTo(dripX,dripY-r*0.3);
        c.bezierCurveTo(dripX+r*0.3,dripY+r*0.2,dripX+r*0.15,dripY+r*0.6,dripX-r*0.1,dripY+r*0.7);
        c.stroke();
      }
    } else if(tid==='hagelslag'||tid==='chocostrips'){
      // Hagelslag over de bolletjes
      for(var hi=0;hi<n;hi++){
        var hbY=hy-r*0.6-hi*r*1.55;
        for(var hj=0;hj<8;hj++){
          var ha=hj*Math.PI*2/8+hi*0.3;
          var hbX=cx+Math.cos(ha)*r*0.65,hbYY=hbY+Math.sin(ha)*r*0.5;
          c.save();c.translate(hbX,hbYY);c.rotate(ha+0.5);
          c.fillStyle=tid==='chocostrips'?'#4e342e':t.kl;
          c.fillRect(-r*0.05,-r*0.015,r*0.1,r*0.03);c.restore();
        }
      }
    } else if(tid==='noten'){
      for(var ni=0;ni<n;ni++){
        var nbY=hy-r*0.6-ni*r*1.55;
        for(var nj=0;nj<6;nj++){
          var na=nj*Math.PI/3+ni*0.5;
          circ(c,cx+Math.cos(na)*r*0.7,nbY+Math.sin(na)*r*0.55,r*0.07,'#8d6e63');
        }
      }
    } else if(tid==='wafel'){
      // Wafelstukje steekt in het ijs
      c.save();c.translate(cx+r*0.6,topY-r*0.1);c.rotate(-0.3);
      var wG=c.createLinearGradient(-r*0.15,0,r*0.15,r*0.8);
      wG.addColorStop(0,'#fff9c4');wG.addColorStop(1,'#f9a825');
      rr(c,-r*0.12,0,r*0.24,r*0.75,3,null);c.fillStyle=wG;c.fill();
      c.strokeStyle='#f9a825';c.lineWidth=1;c.stroke();
      c.strokeStyle='rgba(200,140,0,0.4)';c.lineWidth=0.8;
      c.beginPath();c.moveTo(0,0);c.lineTo(0,r*0.75);c.stroke();
      c.beginPath();c.moveTo(-r*0.12,r*0.25);c.lineTo(r*0.12,r*0.25);c.stroke();
      c.beginPath();c.moveTo(-r*0.12,r*0.5);c.lineTo(r*0.12,r*0.5);c.stroke();
      c.restore();
    }
  });
}

function tekenSlagroomSwirl(c,x,y,r){
  // Swirl opbouwen
  c.save();
  var points=[];
  for(var si=0;si<22;si++){
    var frac=si/21;
    var ang=si*0.55;
    var rad=r*(0.08+frac*0.45);
    var yoff=-frac*r*1.1;
    points.push([x+Math.cos(ang)*rad, y+yoff+Math.sin(ang)*rad*0.4]);
  }
  // Schaduw swirl
  c.strokeStyle='rgba(200,200,200,0.4)';c.lineWidth=r*0.45;c.lineCap='round';c.lineJoin='round';
  c.beginPath();points.forEach(function(p,i){i===0?c.moveTo(p[0],p[1]):c.lineTo(p[0],p[1]);});c.stroke();
  // Witte swirl
  c.strokeStyle='white';c.lineWidth=r*0.38;
  c.beginPath();points.forEach(function(p,i){i===0?c.moveTo(p[0],p[1]):c.lineTo(p[0],p[1]);});c.stroke();
  // Glans lijn
  c.strokeStyle='rgba(255,255,255,0.7)';c.lineWidth=r*0.1;
  c.beginPath();points.slice(0,12).forEach(function(p,i){i===0?c.moveTo(p[0]+1,p[1]-1):c.lineTo(p[0]+1,p[1]-1);});c.stroke();
  // Punt bovenaan
  var top=points[points.length-1];
  circ(c,top[0],top[1],r*0.12,'white');
  c.restore();
}

function tekenKers(c,x,y,r){
  // Steel(s)
  c.strokeStyle='#2e7d32';c.lineWidth=r*0.15;c.lineCap='round';
  c.beginPath();c.moveTo(x,y);c.bezierCurveTo(x+r*0.5,y-r*1.2,x+r*1.5,y-r*0.8,x+r*2,y-r*0.5);c.stroke();
  // Blaadje
  c.fillStyle='#43a047';
  c.beginPath();c.ellipse(x+r,y-r*0.85,r*0.4,r*0.18,0.8,0,Math.PI*2);c.fill();
  // Kers bol
  shadow(c,'rgba(0,0,0,0.25)',r*0.5);
  var kG=c.createRadialGradient(x-r*0.25,y-r*0.25,0,x,y,r);
  kG.addColorStop(0,'#ef5350');kG.addColorStop(0.6,'#c62828');kG.addColorStop(1,'#8e0000');
  circ(c,x,y,r,null);c.fillStyle=kG;c.fill();
  noShadow(c);
  c.strokeStyle='rgba(0,0,0,0.1)';c.lineWidth=1;c.stroke();
  // Glans
  c.fillStyle='rgba(255,200,200,0.55)';
  c.beginPath();c.ellipse(x-r*0.28,y-r*0.28,r*0.3,r*0.2,0.4,0,Math.PI*2);c.fill();
}

function toonKStap(){
  if(kStap>=kStappen.length){klaarKoken();return;}
  var s=kStappen[kStap];
  var pct=Math.round(kStap/kStappen.length*100);
  document.getElementById('kbv').style.width=pct+'%';
  document.getElementById('ku').innerHTML=s.uitleg;
  document.getElementById('ks').textContent=s.sub;
  // Smoothie labels
  var lbs=['✂️ Snijden!','🫙 In de blender!','🌀 MIXEN!','🥤 Gieten!','🎉 Serveren!'];
  var li=s.scene==='snij'?0:s.scene==='blend'&&s.fase===0?1:s.scene==='blend'&&s.fase===1?2:s.scene==='glas'?3:4;
  // IJS labels
  if(s.scene==='ijs_init')   {document.getElementById('kbtn').textContent='🔌 Zet machine aan!';document.getElementById('kbtn').className='pbtn bo';return;}
  if(s.scene==='ijs_schep')  {document.getElementById('kbtn').textContent='🥄 Schep ijs! ('+((s.geSchept||0)+1)+'/3)';document.getElementById('kbtn').className='pbtn bo';return;}
  if(s.scene==='ijs_topping'){var t2=IJS_TOPPINGS.find(function(x){return x.id===s.toppingId;});document.getElementById('kbtn').textContent=(t2?t2.em+' ':'')+' Toevoegen!';document.getElementById('kbtn').className='pbtn bo';return;}
  if(s.scene==='ijs_klaar')  {document.getElementById('kbtn').textContent='🎉 Serveren!';document.getElementById('kbtn').className='pbtn bg';return;}
  document.getElementById('kbtn').textContent=lbs[li];
  document.getElementById('kbtn').className='pbtn '+(s.scene==='klaar'?'bg':'bo');
  if(s.scene==='blend')blFase=s.fase;
}

function volgendKeukenStap(){
  var s=kStappen[kStap];if(!s)return;
  // Smoothie scenes
  if(s.scene==='snij'){
    snijCbFn=function(){s.stukjes=snijGesnedenN;kStap++;toonKStap();};
    initSnij(s.ingId);return;
  }
  if(s.scene==='blend'&&s.fase===0){blInhoud=gekozenIng.slice();speelGeluid('tik');}
  if(s.scene==='blend'&&s.fase===1){blFase=2;speelGeluid('blend');setTimeout(function(){blFase=3;},1000);}
  if(s.scene==='glas'){
    var vp=0;var iv=setInterval(function(){vp+=0.06;kStappen[kStap].vulPct=Math.min(vp,0.92);if(vp>=0.92)clearInterval(iv);},55);
    speelGeluid('tik');
  }
  if(s.scene==='klaar'){klaarKoken();return;}
  // IJS scenes
  if(s.scene==='ijs_init'){
    ijsMachineAan=true;speelGeluid('bel');
    kStap++;setTimeout(toonKStap,600);return;
  }
  if(s.scene==='ijs_schep'){
    s.geSchept=(s.geSchept||0)+1;
    s.schepAnim=0;
    var schepIv=setInterval(function(){s.schepAnim=Math.min(1,(s.schepAnim||0)+0.08);},30);
    setTimeout(function(){clearInterval(schepIv);s.schepAnim=0;},600);
    speelGeluid('tik');
    if(s.geSchept>=3){kStap++;setTimeout(toonKStap,500);}
    else{toonKStap();}
    return;
  }
  if(s.scene==='ijs_topping'){
    s.gedaan=true;speelGeluid('tik');
    kStap++;setTimeout(toonKStap,350);return;
  }
  if(s.scene==='ijs_klaar'){klaarKoken();return;}
  kStap++;setTimeout(toonKStap,280);
}

function klaarKoken(){
  document.getElementById('kbv').style.width='100%';
  if(kAnimId){cancelAnimationFrame(kAnimId);kAnimId=null;}
  document.getElementById('keuken').classList.remove('open');
  barSmootje=true;speelGeluid('bel');
  gameStaat='loopt_bar';dierX=W*0.13;dierLoopt=true;dierRicht=-1;
  var nm=modus==='ijs'?(gekozenSmaak?gekozenSmaak.nm+' ijs':'IJsje'):smootje.nm;
  setFase('✅ '+nm+' is klaar! Serveer '+dier.nm+'!',false);
}

function sluitKeuken(){
  if(kAnimId){cancelAnimationFrame(kAnimId);kAnimId=null;}
  document.getElementById('keuken').classList.remove('open');
  if(gameStaat==='keuken'){toonIngPanel();openPnl();}
}

  document.getElementById('ss').textContent=modus==='ijs'?ijsZinnen[Math.floor(Math.random()*ijsZinnen.length)]:dier.z;
  document.getElementById('ssc').textContent='+'+pt+' ⭐';
  var re=isFav?['💗 Favoriete smaak! Perfect!','⭐⭐⭐ Uitstekend!']:['⭐⭐ Lekker!','😊 Goed gedaan!'];
  document.getElementById('sr').textContent=re[Math.floor(Math.random()*re.length)];
  document.getElementById('srv').classList.add('open');
  speelGeluid('goed');
  setTimeout(function(){voegSterToe(pt);maakConfetti();},300);
}

function sluitSrv(){
  document.getElementById('srv').classList.remove('open');
  dierRicht=1;dierLoopt=true;gameStaat='loopt_weg';
  setFase('👋 Tot ziens '+dier.nm+'!',true);
  barSmootje=false;
}

// Keuken deur klikken (in salon)
gc.addEventListener('click',function(e){
  var r=gc.getBoundingClientRect();
  var x=e.clientX-r.left,y=e.clientY-r.top;
  var dw=W*0.1,dh=H*0.24;
  if(x>W*0.025&&x<W*0.025+dw&&y>vloerY-dh&&y<vloerY)openKeuken();
},false);
gc.addEventListener('touchend',function(e){
  var t=e.changedTouches[0];var r=gc.getBoundingClientRect();
  var x=t.clientX-r.left,y=t.clientY-r.top;
  var dw=W*0.1,dh=H*0.24;
  if(x>W*0.025&&x<W*0.025+dw&&y>vloerY-dh&&y<vloerY)openKeuken();
},false);

// START
try{score=parseInt(localStorage.getItem('mss')||'0');}catch(e){}
document.getElementById('sc').textContent=score;
setTimeout(function(){
  setFase("\uD83C\uDF38 Welkom in Milou\u2019s Smoothie & IJs Salon!",false);
  setTimeout(function(){
    document.getElementById('fase').style.opacity='0';
    setTimeout(nieuweKlant,600);
  },2000);
},400);
loop();
</script>
