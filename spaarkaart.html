<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🎁 Wat wil ik halen?</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root { --roze: #ff6eb4; --roze2: #ffd6ec; --roze3: #fff4fa; --bg: #fff9fc; --wit: #fff; --tekst: #3a2a3a; --muted: #8a7a8a; --shadow: 0 4px 20px rgba(200,100,160,0.12); }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { font-family: 'Nunito', system-ui, sans-serif; background: var(--bg); color: var(--tekst); min-height: 100vh; padding-bottom: env(safe-area-inset-bottom, 0px); }
button { font-family: inherit; color: inherit; }
header { position: sticky; top: 0; z-index: 20; background: linear-gradient(135deg, #ff6eb4, #ffb347); padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; box-shadow: 0 4px 16px rgba(255,110,180,0.3); }
.logo { font-family: 'Pacifico', cursive; font-size: 1.1rem; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.18); }
.kop-knop { background: rgba(255,255,255,0.3); border: none; border-radius: 50px; padding: 7px 14px; color: #fff; font-weight: 800; font-size: 0.82rem; text-decoration: none; }
.container { max-width: 520px; margin: 0 auto; padding: 26px 16px 40px; }
h1 { font-family: 'Pacifico', cursive; font-weight: 400; color: var(--roze); font-size: 1.7rem; text-align: center; margin-bottom: 18px; }
.zoek { display: flex; gap: 8px; }
.zoek input { flex: 1; min-width: 0; border: 3px solid var(--roze2); border-radius: 16px; padding: 15px 16px; font-family: inherit; font-size: 17px; font-weight: 700; color: var(--tekst); background: var(--wit); }
.zoek input:focus { outline: none; border-color: var(--roze); }
.zoek button { border: none; background: var(--roze); color: #fff; font-size: 1.3rem; border-radius: 16px; padding: 0 18px; cursor: pointer; }
.stap { background: var(--wit); border-radius: 22px; box-shadow: var(--shadow); padding: 20px; margin-top: 18px; text-align: center; }
.stap .em { font-size: 3rem; line-height: 1; }
.stap h2 { font-size: 1.2rem; font-weight: 900; line-height: 1.35; margin: 8px 0 4px; }
.stap p { font-size: 0.92rem; font-weight: 700; color: var(--muted); line-height: 1.5; }
.knoppen { display: grid; gap: 10px; margin-top: 16px; }
.knop { display: block; border: none; border-radius: 999px; padding: 15px; font-weight: 900; font-size: 1rem; cursor: pointer; background: var(--roze); color: #fff; text-decoration: none; }
.knop.licht { background: var(--roze3); color: var(--tekst); }
.taken { display: grid; gap: 10px; margin-top: 16px; text-align: left; }
.taak { display: flex; align-items: center; gap: 12px; border: 3px solid #f3e4ec; border-radius: 18px; padding: 12px 14px; }
.taak .em2 { font-size: 2rem; width: 38px; text-align: center; }
.taak .tk { flex: 1; min-width: 0; font-weight: 900; font-size: 1rem; line-height: 1.3; }
.taak a { background: var(--roze); color: #fff; text-decoration: none; font-weight: 900; font-size: 0.85rem; border-radius: 999px; padding: 10px 14px; white-space: nowrap; }
.tips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
.tips button { border: 2px solid var(--roze2); background: var(--wit); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 0.88rem; cursor: pointer; max-width: 100%; overflow-wrap: anywhere; }
.tips-kop { font-size: 0.85rem; font-weight: 800; color: var(--muted); margin-top: 22px; text-align: center; }
.voet { text-align: center; margin-top: 24px; }
.voet a { color: var(--roze); font-weight: 900; font-size: 0.88rem; text-decoration: none; }
</style>
</head>
<body>
<header>
  <a href="index.html" class="kop-knop">← Terug</a>
  <span class="logo">🎁 Wat wil ik halen?</span>
  <a href="prijzenkast.html" class="kop-knop">🏆</a>
</header>

<div class="container">
  <h1>Wat wil je halen?</h1>
  <form class="zoek" onsubmit="event.preventDefault(); zoek();">
    <input id="vraag" type="text" enterkeyhint="search" autocomplete="off" placeholder="Typ het hier…">
    <button type="submit" aria-label="Zoeken">🔎</button>
  </form>
  <div id="stap"></div>
  <div id="tips"></div>
  <div class="voet"><a href="prijzenkast.html">🏆 Mijn prijzenkast ›</a></div>
</div>

<script src="beloningen.js"></script>
<script>
function emojiVan(t) { try { const m = t.match(/\p{Extended_Pictographic}/gu); return m ? m[m.length - 1] : '🎁'; } catch (e) { return '🎁'; } }
function kortNaam(t) { return t.replace(/\p{Extended_Pictographic}|\uFE0F/gu, '').replace(/\(.*?\)/g, '').replace(/\s+/g, ' ').trim(); }
function el(id) { return document.getElementById(id); }

function toonTips() {
  const open = MB.ladder().filter(b => !b.bereikt).slice(0, 4);
  if (!open.length) { el('tips').innerHTML = ''; return; }
  el('tips').innerHTML = '<div class="tips-kop">Of tik op wat je wilt:</div><div class="tips"></div>';
  const rij = el('tips').querySelector('.tips');
  open.forEach(b => {
    const k = document.createElement('button');
    k.textContent = emojiVan(b.beloning) + ' ' + kortNaam(b.beloning);
    k.addEventListener('click', function () { vraagZeker(b); });
    rij.appendChild(k);
  });
}

function zoek() {
  const veld = el('vraag'), v = veld.value.trim();
  if (!v) { veld.focus(); return; }
  veld.blur();
  const b = MB.zoekBeloning(v);
  if (!b) {
    el('stap').innerHTML = '<div class="stap"><div class="em">🤔</div><h2>Die staat nog niet in je lijst</h2><p>Vraag papa of hij hem erbij zet! Of kies hieronder iets anders.</p></div>';
    toonTips(); return;
  }
  vraagZeker(b);
}

// Stap 1: weet je het zeker?
function vraagZeker(b) {
  el('tips').innerHTML = '';
  el('vraag').value = '';
  if (b.bereikt) {
    el('stap').innerHTML = '<div class="stap"><div class="em">🎉</div><h2></h2><p>Die heb je al gewonnen! Hij staat in je prijzenkast.</p>'
      + '<div class="knoppen"><a class="knop" href="prijzenkast.html">🏆 Naar mijn prijzenkast</a><button class="knop licht" onclick="opnieuw()">Iets anders kiezen</button></div></div>';
    el('stap').querySelector('h2').textContent = kortNaam(b.beloning);
    return;
  }
  el('stap').innerHTML = '<div class="stap"><div class="em">' + emojiVan(b.beloning) + '</div><h2></h2><p>Weet je dit zeker?</p>'
    + '<div class="knoppen"><button class="knop" id="ja">✅ Ja, dit wil ik!</button><button class="knop licht" onclick="opnieuw()">↩️ Nee, iets anders</button></div></div>';
  el('stap').querySelector('h2').textContent = kortNaam(b.beloning);
  el('ja').addEventListener('click', function () { toonTaken(b); });
}

// Stap 2: dit moet je doen
function toonTaken(b) {
  var inhoud = '';
  if (b.type === 'pakket') {
    const rest = MB.nogTeDoen(b);
    inhoud = rest.length
      ? '<div class="taken">' + rest.map(function (x) { return '<div class="taak"><div class="em2">' + MB.TAKEN[x.soort].emoji + '</div><div class="tk">' + x.nog + ' ' + (x.nog === 1 ? MB.TAKEN[x.soort].een : MB.TAKEN[x.soort].meer) + '</div><a href="' + MB.TAKEN[x.soort].link + '">Doe nu ›</a></div>'; }).join('') + '</div>'
      : '<p>Je bent al klaar! 🎉</p>';
  } else if (b.type === 'dagen') {
    const r = Math.max(0, b.drempel - MB.oefendagen());
    inhoud = '<div class="taken"><div class="taak"><div class="em2">📅</div><div class="tk">Nog ' + r + (r === 1 ? ' dag' : ' dagen') + ' oefenen</div><a href="leren.html">Doe nu ›</a></div></div>';
  } else {
    inhoud = '<div class="taken"><div class="taak"><div class="em2">🏅</div><div class="tk">Haal ' + MB.NAMEN[b.onderdeel] + ' niveau ' + b.drempel + '</div><a href="' + (b.onderdeel === 'klokkijken' ? 'leren.html?open=klok' : 'taal.html?open=' + b.onderdeel) + '">Doe nu ›</a></div></div>';
  }
  el('stap').innerHTML = '<div class="stap"><div class="em">' + emojiVan(b.beloning) + '</div><h2>Dit moet je nog doen:</h2>' + inhoud
    + '<div class="knoppen"><button class="knop licht" onclick="opnieuw()">↩️ Iets anders kiezen</button></div></div>';
}

function opnieuw() { el('stap').innerHTML = ''; el('vraag').value = ''; toonTips(); }

MB.check();
toonTips();
(function () {
  const q = new URLSearchParams(location.search).get('vraag'), id = new URLSearchParams(location.search).get('id');
  if (id) { const b = MB.ladder().find(function (x) { return x.id === id; }); if (b) return vraagZeker(b); }
  if (q) { el('vraag').value = q; zoek(); }
})();
</script>
</body>
</html>
