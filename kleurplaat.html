<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kleurplaten</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #f7a8c4; --pink-d: #e0287d; --mint: #a8e6cf; --lav: #c9b8f0;
    --bg: #fdf6fa; --card: #ffffff; --text: #3a2a3a; --muted: #8a7a8a;
    --lijn: #2b2233;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Nunito', system-ui, sans-serif; background: var(--bg); color: var(--text);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-user-select: none; user-select: none;
  }
  button { font-family: inherit; touch-action: manipulation; cursor: pointer; border: none; }

  /* Lijnen van de kleurplaten */
  .r { stroke: var(--lijn); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .d { fill: none; stroke: var(--lijn); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .dt { fill: none; stroke: var(--lijn); stroke-width: 2; pointer-events: none; }

  /* ── GALERIJ ── */
  #galerij { max-width: 1100px; margin: 0 auto; padding: 16px 16px 40px; }
  .gal-top { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .terug {
    display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px;
    border-radius: 50%; background: var(--card); color: var(--text); text-decoration: none;
    font-size: 1.3rem; box-shadow: 0 2px 10px rgba(180,100,140,0.15);
  }
  .gal-top h1 { font-family: 'Pacifico', cursive; font-weight: 400; font-size: 2rem; color: var(--pink-d); }
  .gal-sub { color: var(--muted); font-weight: 700; margin: 0 0 16px 56px; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
  .tab {
    flex: none; padding: 9px 16px; border-radius: 999px; background: var(--card); color: var(--text);
    font-weight: 800; font-size: 0.9rem; box-shadow: 0 2px 8px rgba(180,100,140,0.12);
  }
  .tab.actief { background: var(--pink-d); color: white; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .kaart {
    content-visibility: auto; contain-intrinsic-size: 200px;
    background: var(--card); border-radius: 22px; padding: 10px 10px 12px; text-align: center;
    box-shadow: 0 3px 14px rgba(180,100,140,0.13); transition: transform .15s;
  }
  .kaart:active { transform: scale(0.97); }
  .kaart svg { width: 100%; aspect-ratio: 1; display: block; border-radius: 14px; pointer-events: none; }
  .kaart .naam { font-weight: 800; margin-top: 8px; font-size: 0.95rem; }
  .kaart .bezig { font-size: 0.72rem; color: var(--pink-d); font-weight: 800; }

  /* ── VOORTGANG ── */
  .voortgang { background: var(--card); border-radius: 18px; padding: 12px 16px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(180,100,140,0.12); }
  .vg-tekst { font-weight: 900; font-size: 0.95rem; display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .vg-tekst span { color: var(--muted); font-weight: 800; font-size: 0.82rem; }
  .vg-balk { height: 14px; border-radius: 999px; background: #f6eef4; overflow: hidden; }
  .vg-balk div { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #ff7bb5, #a77bff); transition: width .5s; }
  .kaart { position: relative; }
  .kaart.klaar { box-shadow: 0 0 0 3px #5fcf6b, 0 3px 14px rgba(180,100,140,0.13); }
  .vink-badge {
    position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border-radius: 50%;
    background: #2ea44f; color: white; font-weight: 900; font-size: 1.1rem; display: flex;
    align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2); z-index: 2;
  }
  .vg-level { margin-top: 8px; font-size: 0.85rem; color: var(--muted); font-weight: 700; }
  .vg-level b { color: var(--pink-d); }
  .level-kop { grid-column: 1 / -1; margin: 10px 0 0; padding: 12px 16px; border-radius: 18px; background: linear-gradient(135deg, #ffe0ee, #eee0ff); }
  .level-kop.dicht { background: #f1eef2; }
  .lk-titel { font-weight: 900; font-size: 1.1rem; }
  .lk-sub { font-size: 0.82rem; color: var(--muted); font-weight: 700; margin-top: 2px; }
  .lvl-badge { position: absolute; top: 6px; left: 6px; background: rgba(255,255,255,0.92); border-radius: 999px; padding: 2px 8px; font-size: 0.72rem; font-weight: 900; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 2; }
  .kaart.dicht svg { opacity: 0.35; filter: grayscale(1); }
  .slot { position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); font-size: 2.4rem; z-index: 2; }
  .tab .tel { opacity: 0.75; font-size: 0.78rem; margin-left: 4px; }
  #klaarKnop.is-klaar { background: #2ea44f; color: white; }
  .confetti { position: fixed; top: -12px; width: 10px; height: 14px; border-radius: 2px; z-index: 30; pointer-events: none; animation: vallen 1.8s ease-in forwards; }
  @keyframes vallen { to { transform: translateY(105vh) rotate(540deg); opacity: 0.8; } }

  /* ── EDITOR ── */
  #editor {
    position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #editor.open { display: flex; }
  .ed-top { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  .ed-top h2 { flex: 1; font-size: 1.05rem; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .knop {
    height: 44px; min-width: 44px; padding: 0 12px; border-radius: 14px; background: var(--card);
    color: var(--text); font-weight: 800; font-size: 0.9rem; box-shadow: 0 2px 8px rgba(180,100,140,0.14);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .knop.roze { background: var(--pink-d); color: white; }
  .ed-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .doek { flex: 1; min-height: 0; padding: 4px 12px; display: flex; align-items: center; justify-content: center; }
  #plaat {
    width: 100%; height: 100%; touch-action: none; display: block; overflow: hidden;
    filter: drop-shadow(0 4px 16px rgba(180,100,140,0.18));
  }
  #plaat .pen { pointer-events: none; }
  .omlijn { fill: none; stroke: var(--lijn); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
  #plaat.hand { cursor: grab; }
  .doek { position: relative; }
  .zoomknoppen { position: absolute; right: 18px; bottom: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 3; }
  .zoomknoppen button {
    width: 46px; height: 46px; border-radius: 50%; background: var(--card); color: var(--text); font-size: 1.25rem; font-weight: 900;
    box-shadow: 0 2px 10px rgba(180,100,140,0.25); display: flex; align-items: center; justify-content: center;
  }
  .zoomknoppen button.actief { background: var(--pink-d); color: white; }
  .lijntjes {
    width: 100%; height: 44px; border-radius: 14px; background: #f6eef4; color: var(--text); font-weight: 900; font-size: 0.85rem;
  }
  .lijntjes.aan { background: #dcf7d4; color: #1f7a4d; }
  #plaat.gum .pen { pointer-events: stroke; }

  .paneel {
    background: var(--card); border-radius: 24px 24px 0 0; padding: 12px 14px 14px;
    box-shadow: 0 -4px 20px rgba(180,100,140,0.12); max-height: 46vh; overflow-y: auto;
  }
  .rij { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .tool {
    flex: 1; min-width: 70px; height: 52px; border-radius: 16px; background: #f6eef4; color: var(--text);
    font-weight: 900; font-size: 0.82rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1.1;
  }
  .tool.actief { background: var(--pink-d); color: white; }
  .dikte { display: flex; align-items: center; gap: 12px; width: 100%; }
  .dikte label { font-weight: 800; font-size: 0.85rem; color: var(--muted); }
  .dikte input[type=range] { flex: 1; accent-color: var(--pink-d); height: 28px; }
  .voorbeeld { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; flex: none; }
  .voorbeeld span { border-radius: 50%; display: block; border: 1.5px solid rgba(0,0,0,0.15); }
  .kleur-nu {
    width: 46px; height: 46px; border-radius: 50%; border: 3px solid white; flex: none;
    box-shadow: 0 0 0 2px var(--pink-d);
  }
  .eigen {
    position: relative; height: 46px; padding: 0 14px; border-radius: 16px; background: #f6eef4;
    font-weight: 800; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; overflow: hidden;
  }
  .eigen input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .palet { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; }
  .vak {
    aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(0,0,0,0.08); min-width: 0;
    transition: transform .1s;
  }
  .vak.actief { transform: scale(1.18); box-shadow: 0 0 0 3px white, 0 0 0 5px var(--pink-d); }
  .speciaal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .speciaal .vak { aspect-ratio: auto; height: 38px; border-radius: 12px; font-size: 0.72rem; font-weight: 900; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.45); }

  .melding {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
    background: var(--text); color: white; padding: 10px 18px; border-radius: 999px; font-weight: 800;
    opacity: 0; transition: all .25s; pointer-events: none; z-index: 20;
  }
  .melding.toon { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* iPad liggend / groot scherm: paneel aan de zijkant */
  @media (min-width: 820px) and (orientation: landscape) {
    .ed-main { flex-direction: row; }
    .paneel { width: 340px; flex: none; max-height: none; border-radius: 24px 0 0 24px; margin: 0 0 12px; }
    .palet { grid-template-columns: repeat(6, 1fr); gap: 8px; }
  }
  @media (max-width: 480px) {
    .palet { grid-template-columns: repeat(8, 1fr); }
    .knop .tekst { display: none; }
  }
</style>
</head>
<body>

<!-- Speciale vullingen (gedeeld door alle kleurplaten) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="specialeDefs"></defs></svg>

<!-- ══════════ GALERIJ ══════════ -->
<div id="galerij">
  <div class="gal-top">
    <a href="index.html" class="terug" aria-label="Terug naar Milou's Wereld">←</a>
    <h1>Kleurplaten</h1>
  </div>
  <p class="gal-sub">Tik op een vlak en het kleurt meteen in 🎨</p>
  <div class="voortgang">
    <div class="vg-tekst"><div id="vgTekst"></div><span id="vgSub"></span></div>
    <div class="vg-balk"><div id="vgVul"></div></div>
    <div class="vg-level" id="vgLevel"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</div>

<!-- ══════════ EDITOR ══════════ -->
<div id="editor">
  <div class="ed-top">
    <button class="knop" onclick="sluitEditor()" aria-label="Terug">←</button>
    <h2 id="edTitel"></h2>
    <button class="knop" onclick="ongedaan()" aria-label="Ongedaan maken">↩️<span class="tekst">Terug</span></button>
    <button class="knop" onclick="wisAlles()" aria-label="Opnieuw beginnen">🗑️<span class="tekst">Opnieuw</span></button>
    <button class="knop" id="geluidKnop" onclick="wisselGeluid()" aria-label="Geluid aan of uit">🔊</button>
    <button class="knop" id="klaarKnop" onclick="wisselKlaar()" aria-label="Klaar">✅<span class="tekst">Klaar!</span></button>
    <button class="knop roze" onclick="opslaan()" aria-label="Opslaan">💾<span class="tekst">Opslaan</span></button>
  </div>
  <div class="ed-main">
    <div class="doek">
      <svg id="plaat" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="zoomknoppen">
        <button onclick="zoomKnop(0.7)" aria-label="Inzoomen">＋</button>
        <button onclick="zoomKnop(1.43)" aria-label="Uitzoomen">－</button>
        <button id="handKnop" onclick="kiesTool(tool === 'hand' ? 'vul' : 'hand', tool === 'hand' ? document.querySelector('[data-tool=vul]') : null)" aria-label="Verschuiven">✋</button>
        <button id="zoomReset" onclick="zoomTerug()" aria-label="Hele plaat">⤢</button>
      </div>
    </div>
    <div class="paneel">
      <div class="rij">
        <button class="tool actief" data-tool="vul" onclick="kiesTool('vul', this)">🪣 Vullen</button>
        <button class="tool" data-tool="pen" onclick="kiesTool('pen', this)">🖊️ Pen</button>
        <button class="tool" data-tool="potlood" onclick="kiesTool('potlood', this)">✏️ Potlood</button>
        <button class="tool" data-tool="gum" onclick="kiesTool('gum', this)">🧽 Gum</button>
      </div>
      <div class="rij" id="dikteRij" style="display:none">
        <div class="dikte">
          <label for="dikte">Dikte</label>
          <input type="range" id="dikte" min="2" max="40" value="8" oninput="updateVoorbeeld()">
          <div class="voorbeeld"><span id="voorbeeldStip"></span></div>
        </div>
        <button class="lijntjes" id="lijntjesKnop" onclick="wisselLijntjes()"></button>
      </div>
      <div class="rij">
        <div class="kleur-nu" id="kleurNu"></div>
        <label class="eigen">🌈 Eigen kleur<input type="color" id="eigenKleur" value="#ff5fa2" oninput="kiesKleur(this.value, null)"></label>
      </div>
      <div class="palet" id="palet"></div>
      <div class="speciaal" id="speciaal"></div>
    </div>
  </div>
</div>

<div class="melding" id="melding"></div>

<script>
// ═══════════════════════════════════════
//  HULPFUNCTIES VOOR TEKENEN
// ═══════════════════════════════════════
const f = n => Math.round(n * 10) / 10;
const R  = s => `<${s} class="r" fill="#ffffff"/>`;
const D  = s => `<${s} class="d"/>`;
const C  = (cx, cy, r) => R(`circle cx="${cx}" cy="${cy}" r="${r}"`);
const E  = (cx, cy, rx, ry, rot) => R(`ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"${rot ? ` transform="rotate(${rot} ${cx} ${cy})"` : ''}`);
const P  = d => R(`path d="${d}"`);
const RT = (x, y, w, h, rx, rot) => R(`rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx || 0}"${rot ? ` transform="rotate(${rot} ${f(x + w / 2)} ${f(y + h / 2)})"` : ''}`);
const L  = d => D(`path d="${d}"`);
const BG = () => R('rect x="0" y="0" width="400" height="400"');

function hartPad(x, y, h) {
  return `M${f(x)} ${f(y + 0.3 * h)} C${f(x)} ${f(y - 0.05 * h)} ${f(x - 0.55 * h)} ${f(y - 0.1 * h)} ${f(x - 0.55 * h)} ${f(y + 0.3 * h)} ` +
         `C${f(x - 0.55 * h)} ${f(y + 0.6 * h)} ${f(x - 0.1 * h)} ${f(y + 0.8 * h)} ${f(x)} ${f(y + h)} ` +
         `C${f(x + 0.1 * h)} ${f(y + 0.8 * h)} ${f(x + 0.55 * h)} ${f(y + 0.6 * h)} ${f(x + 0.55 * h)} ${f(y + 0.3 * h)} ` +
         `C${f(x + 0.55 * h)} ${f(y - 0.1 * h)} ${f(x)} ${f(y - 0.05 * h)} ${f(x)} ${f(y + 0.3 * h)} Z`;
}
const hart = (x, y, h) => P(hartPad(x, y, h));

function ster(cx, cy, r1, r2) {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const a = (-90 + i * 36) * Math.PI / 180, r = i % 2 === 0 ? r1 : r2;
    d += (i === 0 ? 'M' : 'L') + f(cx + Math.cos(a) * r) + ' ' + f(cy + Math.sin(a) * r) + ' ';
  }
  return P(d + 'Z');
}
function bloem(cx, cy, r) {
  let s = '';
  for (let i = 0; i < 5; i++) {
    const a = (-90 + i * 72) * Math.PI / 180;
    s += C(f(cx + Math.cos(a) * r * 0.6), f(cy + Math.sin(a) * r * 0.6), f(r * 0.5));
  }
  return s + C(cx, cy, f(r * 0.4));
}
function wolk(x, y, w) {
  return P(`M${x} ${y} A${f(w * 0.2)} ${f(w * 0.2)} 0 0 1 ${f(x + w * 0.3)} ${f(y - w * 0.2)} ` +
           `A${f(w * 0.25)} ${f(w * 0.25)} 0 0 1 ${f(x + w * 0.7)} ${f(y - w * 0.2)} ` +
           `A${f(w * 0.2)} ${f(w * 0.2)} 0 0 1 ${f(x + w)} ${y} Z`);
}
function noot(x, y) {
  return RT(x + 10, y - 55, 5, 55) +
         P(`M${x + 15} ${y - 55} q20 10 18 32 q-4 -14 -18 -18 Z`) +
         E(x + 2, y, 14, 10, -20);
}
function blaadje(cx, cy, rot) { return E(cx, cy, 20, 9, rot); }
function banaan(x, y, rot) {
  return `<g transform="translate(${x} ${y}) rotate(${rot})">` +
    P('M0 0 C25 -35 75 -45 105 -22 C101 -14 96 -12 90 -14 C62 -30 30 -22 8 8 Z') +
    P('M0 0 L-9 4 L-5 13 L8 8 Z') + L('M22 -10 C45 -27 72 -30 96 -18') + '</g>';
}
function palmblad(x, y, rot) {
  return `<g transform="translate(${x} ${y}) rotate(${rot})">` +
    P('M0 0 C40 -34 110 -34 150 0 C110 14 40 14 0 0 Z') +
    L('M6 0 L144 0 M40 -12 L52 0 M70 -16 L82 0 M100 -13 L112 0 M45 8 L55 0 M78 9 L88 0') + '</g>';
}
// Tekst waarvan je elke letter apart kunt inkleuren
function naamTekst(tekst, x, y, grootte, spatie) {
  const letters = tekst.split('').map(ch => ch === ' ' ? ' ' : `<tspan class="r" fill="#ffffff">${ch}</tspan>`).join('');
  return `<text x="${x}" y="${y}" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="900" font-size="${grootte}" letter-spacing="${spatie || 0}">${letters}</text>`;
}

// ═══════════════════════════════════════
//  KLEURPLATEN
// ═══════════════════════════════════════
const PLATEN = [
  // ─────────── MIJN NAAM ───────────
  { id: 'milou-hartjes', naam: 'Milou met hartjes', cat: 'naam', teken: () =>
    BG() + hart(55, 30, 60) + hart(345, 40, 50) + hart(60, 320, 50) + hart(340, 315, 56) +
    ster(120, 60, 16, 7) + ster(285, 330, 14, 6) + ster(40, 200, 12, 5) + ster(365, 200, 12, 5) + ster(200, 365, 12, 5) +
    P('M128 158 L146 100 L176 134 L200 84 L224 134 L254 100 L272 158 Z') +
    C(146, 100, 8) + C(200, 84, 9) + C(254, 100, 8) + RT(124, 156, 152, 16, 5) +
    naamTekst('Milou', 200, 265, 112, 2) +
    hart(130, 292, 22) + hart(170, 292, 22) + hart(210, 292, 22) + hart(250, 292, 22) + hart(290, 292, 22)
  },
  { id: 'milou-regenboog', naam: 'Milou met regenboog', cat: 'naam', teken: () => {
    let s = BG();
    const rb = [180, 167, 154, 141, 128, 115];
    for (let i = 0; i < 5; i++) {
      const a = rb[i], b = rb[i + 1];
      s += P(`M${200 - a} 235 A${a} ${a} 0 0 1 ${200 + a} 235 L${200 + b} 235 A${b} ${b} 0 0 0 ${200 - b} 235 Z`);
    }
    s += wolk(0, 250, 110) + wolk(290, 250, 110) + C(200, 170, 34) +
         ster(40, 50, 16, 7) + ster(360, 50, 16, 7) + ster(200, 70, 10, 4) +
         naamTekst('Milou', 200, 345, 98, 2) + hart(60, 360, 26) + hart(340, 360, 26);
    return s;
  }},
  { id: 'sterrekijker', naam: 'De Sterrekijker', cat: 'naam', teken: () => {
    let s = BG() + C(345, 55, 32) + C(360, 47, 27) +
      ster(40, 40, 14, 6) + ster(115, 30, 9, 4) + ster(280, 25, 10, 4) + ster(30, 200, 11, 5) + ster(370, 205, 12, 5) + ster(190, 215, 9, 4) + ster(240, 205, 7, 3) +
      naamTekst('De', 200, 98, 50, 1) + naamTekst('Sterrekijker', 200, 172, 56, -1) +
      P('M0 345 Q200 300 400 345 L400 400 L0 400 Z') +
      RT(40, 265, 160, 85) + P('M30 268 L120 215 L210 268 Z') + ster(120, 245, 13, 6) +
      RT(55, 282, 30, 26, 3) + RT(155, 282, 30, 26, 3) + RT(104, 300, 32, 50, 3) + C(128, 327, 3) +

function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// Hoek 0 = boven, met de klok mee
function pol(cx, cy, a, r) { const g = a * Math.PI / 180; return [f(cx + Math.sin(g) * r), f(cy - Math.cos(g) * r)]; }
function gezicht(cx, cy, w, blos) {
  const r = f(w * 0.3);
  let s = C(f(cx - w), cy, r) + C(f(cx + w), cy, r) +
    C(f(cx - w + r * 0.35), f(cy - r * 0.35), f(r * 0.38)) + C(f(cx + w + r * 0.35), f(cy - r * 0.35), f(r * 0.38)) +
    L(`M${f(cx - w * 0.35)} ${f(cy + w * 0.5)} Q${cx} ${f(cy + w * 0.9)} ${f(cx + w * 0.35)} ${f(cy + w * 0.5)}`);
  if (blos !== false) s += E(f(cx - w * 1.6), f(cy + w * 0.6), f(w * 0.38), f(w * 0.24)) + E(f(cx + w * 1.6), f(cy + w * 0.6), f(w * 0.38), f(w * 0.24));
  return s;
}
function blob(cx, cy, r, amp, n, fase) {
  let d = ''; const N = n * 10;
  for (let i = 0; i <= N; i++) {
    const a = i / N * 2 * Math.PI, rr = r + amp * Math.sin(n * a + (fase || 0));
    d += (i ? 'L' : 'M') + f(cx + Math.cos(a) * rr) + ' ' + f(cy + Math.sin(a) * rr) + ' ';
  }
  return P(d + 'Z');
}
function ellipsStreep(cx, cy, rx, ry, x1, x2) {
  const boven = [], onder = [];
  for (let k = 0; k <= 12; k++) {
    const x = x1 + (x2 - x1) * k / 12, q = (x - cx) / rx, dy = ry * Math.sqrt(Math.max(0, 1 - q * q));
    boven.push(f(x) + ' ' + f(cy - dy)); onder.unshift(f(x) + ' ' + f(cy + dy));
  }
  return P('M' + boven.join(' L') + ' L' + onder.join(' L') + ' Z');
}
function sector(cx, cy, r1, r2, a0, a1) {
  const g = a1 - a0 > 180 ? 1 : 0, p0 = pol(cx, cy, a0, r2), p1 = pol(cx, cy, a1, r2);
  if (!r1) return P(`M${cx} ${cy} L${p0[0]} ${p0[1]} A${r2} ${r2} 0 ${g} 1 ${p1[0]} ${p1[1]} Z`);
  const q0 = pol(cx, cy, a0, r1), q1 = pol(cx, cy, a1, r1);
  return P(`M${p0[0]} ${p0[1]} A${r2} ${r2} 0 ${g} 1 ${p1[0]} ${p1[1]} L${q1[0]} ${q1[1]} A${r1} ${r1} 0 ${g} 0 ${q0[0]} ${q0[1]} Z`);
}
function lint(x, y0, y1, w, amp, golf) {
  const l = [], r = [];
  for (let y = y0; y <= y1; y += 6) {
    const t = (y - y0) / (y1 - y0), xc = x + amp * Math.sin((y - y0) / golf * 2 * Math.PI), hw = w / 2 * (1 - 0.65 * t);
    l.push(f(xc - hw) + ' ' + y); r.unshift(f(xc + hw) + ' ' + y);
  }
  return P('M' + l.join(' L') + ' L' + r.join(' L') + ' Z');
}
function golfBand(y, h, amp, n) {
  let d = `M0 ${y}`;
  for (let i = 0; i < n; i++) { const w = 400 / n, x = i * w; d += ` Q${f(x + w / 4)} ${y - amp} ${f(x + w / 2)} ${y} T${f(x + w)} ${y}`; }
  return P(d + ` L400 ${y + h} L0 ${y + h} Z`);
}
function glazuur(x, y, w, h, n) {
  let d = `M${x} ${y} L${x + w} ${y} L${x + w} ${y + h}`;
  for (let i = n - 1; i >= 0; i--) {
    const a = x + (i + 1) * w / n, b = x + i * w / n, diep = i % 2 ? h * 1.3 : h * 0.6;
    d += ` Q${f((a + b) / 2)} ${f(y + h + diep)} ${f(b)} ${y + h}`;
  }

const NODIG_VOOR_VOLGENDE = 10;   // zoveel klaar in een level om het volgende te openen
(function bepaalLevels() {
  // Hoe meer vlakjes, hoe moeilijker
  PLATEN.forEach(p => { p.vlakken = (p.teken().match(/class="r"/g) || []).length; });
  const gesorteerd = PLATEN.slice().sort((a, b) => a.vlakken - b.vlakken || PLATEN.indexOf(a) - PLATEN.indexOf(b));
  const per = Math.ceil(PLATEN.length / LEVELS.length);
  gesorteerd.forEach((p, i) => { p.level = Math.min(LEVELS.length, Math.floor(i / per) + 1); });
})();
function klaarInLevel(n, klaar) { return PLATEN.filter(p => p.level === n && klaar.indexOf(p.id) > -1).length; }
function levelOpen(n, klaar) {
  klaar = klaar || laadKlaar();
  for (let l = 2; l <= n; l++) if (klaarInLevel(l - 1, klaar) < NODIG_VOOR_VOLGENDE) return false;
  return true;
}
function hoogsteLevel(klaar) {
  klaar = klaar || laadKlaar();
  let h = 1;
  while (h < LEVELS.length && levelOpen(h + 1, klaar)) h++;

}

function geluid(naam) {
  if (!geluidAan) return;
  if (naam === 'vul') { const n = NOTEN[Math.floor(Math.random() * NOTEN.length)]; toon(n, 0.18, 'triangle', 0.22, n * 1.5); toon(n * 2, 0.12, 'sine', 0.06); }
  if (naam === 'pen') ruis(0.14, 2400, 0.09);
  if (naam === 'gum') { toon(1300, 0.07, 'sine', 0.12, 900); toon(1300, 0.07, 'sine', 0.12, 900, 0.09); }
  if (naam === 'terug') toon(700, 0.2, 'sine', 0.16, 300);
  if (naam === 'kleur') toon(1500, 0.05, 'sine', 0.08);
  if (naam === 'klaar') { [523, 659, 784, 1047].forEach((n, i) => toon(n, 0.25, 'triangle', 0.2, null, i * 0.1)); toon(2093, 0.4, 'sine', 0.08, null, 0.42); }
  if (naam === 'wis') ruis(0.4, 900, 0.12);
}
function wisselGeluid() {
  geluidAan = !geluidAan;
  try { localStorage.setItem('kleurplaat-geluid', geluidAan ? 'aan' : 'uit'); } catch (e) {}
  updateGeluidKnop();
  if (geluidAan) geluid('kleur');
}
function updateGeluidKnop() {
  document.getElementById('geluidKnop').innerHTML = geluidAan ? '🔊' : '🔇';
}

// ═══════════════════════════════════════
//  BINNEN DE LIJNTJES
// ═══════════════════════════════════════
var binnenLijntjes = true;
try { binnenLijntjes = localStorage.getItem('kleurplaat-lijntjes') !== 'uit'; } catch (e) {}
function wisselLijntjes() {
  binnenLijntjes = !binnenLijntjes;
  try { localStorage.setItem('kleurplaat-lijntjes', binnenLijntjes ? 'aan' : 'uit'); } catch (e) {}
  updateLijntjesKnop();
  melding(binnenLijntjes ? '🎯 Je kleurt nu binnen de lijntjes' : 'Je kunt nu overal tekenen');
}
function updateLijntjesKnop() {
  const k = document.getElementById('lijntjesKnop');
  k.classList.toggle('aan', binnenLijntjes);
  k.innerHTML = binnenLijntjes ? '🎯 Binnen de lijntjes: aan' : '🎯 Binnen de lijntjes: uit';
}
// Transformaties van alle ouders optellen (werkt ook zonder dat het plaatje zichtbaar is)
function relMatrix(el, svg) {
  const keten = [];
  let n = el;
  while (n && n !== svg) {
    if (n.transform && n.transform.baseVal && n.transform.baseVal.numberOfItems) keten.unshift(n.transform.baseVal.consolidate().matrix);
    n = n.parentNode;
  }
  let m = svg.createSVGMatrix();
  keten.forEach(c => { m = m.multiply(c); });
  return m;
}
const mStr = m => `matrix(${f(m.a * 1000) / 1000} ${f(m.b * 1000) / 1000} ${f(m.c * 1000) / 1000} ${f(m.d * 1000) / 1000} ${f(m.e)} ${f(m.f)})`;
function kleurGroep(svg, idx) {
  let g = svg.querySelector(`g.kleurgroep[data-r="${idx}"]`);
  if (g) return g;
  const regio = svg.querySelectorAll('.r')[idx];
  if (!regio) return null;
  const anker = regio.tagName.toLowerCase() === 'tspan' ? regio.parentNode : regio;
  const ns = 'http://www.w3.org/2000/svg', pfx = svg.getAttribute('data-pfx') || 'x', clipId = `kc-${pfx}-${idx}`;
  // Knipvorm in de coördinaten van de hele kleurplaat
  const cp = document.createElementNS(ns, 'clipPath');
  cp.setAttribute('id', clipId); cp.setAttribute('clipPathUnits', 'userSpaceOnUse');
  const vorm = anker.cloneNode(true);
  vorm.removeAttribute('class'); vorm.removeAttribute('transform');
  vorm.querySelectorAll && vorm.querySelectorAll('tspan').forEach(t => t.removeAttribute('class'));
  vorm.setAttribute('transform', mStr(relMatrix(anker, svg)));
  cp.appendChild(vorm);
  let defs = svg.querySelector('defs');
  if (!defs) { defs = document.createElementNS(ns, 'defs'); svg.insertBefore(defs, svg.firstChild); }
  defs.appendChild(cp);
  // Groep direct na het vlak, zodat vlakken erboven er gewoon overheen blijven liggen
  g = document.createElementNS(ns, 'g');
  g.setAttribute('class', 'kleurgroep'); g.setAttribute('data-r', idx);
  g.setAttribute('transform', mStr(relMatrix(anker.parentNode, svg).inverse()));
  const gIn = document.createElementNS(ns, 'g');
  gIn.setAttribute('clip-path', `url(#${clipId})`);
  const pen = document.createElementNS(ns, 'g'); pen.setAttribute('class', 'sub-pen');
  const pot = document.createElementNS(ns, 'g'); pot.setAttribute('class', 'sub-potlood'); pot.setAttribute('filter', 'url(#potlood-korrel)');
  gIn.appendChild(pot); gIn.appendChild(pen); g.appendChild(gIn);
  // Lijntje er opnieuw overheen, zodat de rand zichtbaar blijft
  const rand = anker.cloneNode(true);
  rand.setAttribute('class', 'omlijn'); rand.setAttribute('fill', 'none');
  rand.querySelectorAll && rand.querySelectorAll('tspan').forEach(t => { t.removeAttribute('class'); t.setAttribute('fill', 'none'); });
  anker.parentNode.insertBefore(g, anker.nextSibling);
  anker.parentNode.insertBefore(rand, g.nextSibling);
  return g;
}
function laagVoor(svg, soort, idx) {
  if (idx >= 0) { const g = kleurGroep(svg, idx); if (g) return g.querySelector(soort === 'potlood' ? '.sub-potlood' : '.sub-pen'); }
  return svg.querySelector(soort === 'potlood' ? '.potloodlaag' : '.penlaag');
}

// ═══════════════════════════════════════
//  IN- EN UITZOOMEN
// ═══════════════════════════════════════
var vb = { x: 0, y: 0, w: 400 };
function zetViewBox() {
  vb.w = Math.max(60, Math.min(400, vb.w));
  vb.x = Math.max(0, Math.min(400 - vb.w, vb.x));
  vb.y = Math.max(0, Math.min(400 - vb.w, vb.y));
  plaat.setAttribute('viewBox', `${f(vb.x)} ${f(vb.y)} ${f(vb.w)} ${f(vb.w)}`);
  document.getElementById('zoomReset').style.opacity = vb.w < 399 ? '1' : '0.45';
}
function schermInfo() {
  const r = plaat.getBoundingClientRect(), k = Math.min(r.width, r.height) / vb.w;
  return { r: r, k: k, ox: (r.width - vb.w * k) / 2, oy: (r.height - vb.w * k) / 2 };
}
function naarPlaat(cx, cy) {
  const s = schermInfo();
  return [vb.x + (cx - s.r.left - s.ox) / s.k, vb.y + (cy - s.r.top - s.oy) / s.k];
}
function zoomBij(cx, cy, factor) {
  const p = naarPlaat(cx, cy);
  vb.w = Math.max(60, Math.min(400, vb.w * factor));
  const s = schermInfo();
  vb.x = p[0] - (cx - s.r.left - s.ox) / s.k;
  vb.y = p[1] - (cy - s.r.top - s.oy) / s.k;
  zetViewBox();
}
function zoomKnop(factor) {
  const r = plaat.getBoundingClientRect();
  zoomBij(r.left + r.width / 2, r.top + r.height / 2, factor);
}
function zoomTerug() { vb = { x: 0, y: 0, w: 400 }; zetViewBox(); }
plaat.addEventListener('wheel', function (e) {
  e.preventDefault();
  zoomBij(e.clientX, e.clientY, Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.002)));
}, { passive: false });

// ═══════════════════════════════════════
//  AANRAKEN, TEKENEN, KNIJPEN
// ═══════════════════════════════════════
const vingers = new Map();
let knijp = null, wachtVul = null, schuif = null, lijnIdx = -1;

function afstand(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function startKnijp() {
  const p = Array.from(vingers.values());
  // Een net begonnen streep of vulling annuleren: ze wil zoomen
  if (lijn) { lijn.remove(); lijn = null; }
  wachtVul = null; actievePointer = null; gumBezig = false;
  knijp = { d0: afstand(p[0], p[1]), w0: vb.w, m: naarPlaat((p[0].x + p[1].x) / 2, (p[0].y + p[1].y) / 2) };
}
function updateKnijp() {
  const p = Array.from(vingers.values());
  if (p.length < 2) return;
  const cx = (p[0].x + p[1].x) / 2, cy = (p[0].y + p[1].y) / 2;
  vb.w = Math.max(60, Math.min(400, knijp.w0 * knijp.d0 / Math.max(10, afstand(p[0], p[1]))));
  const s = schermInfo();
  vb.x = knijp.m[0] - (cx - s.r.left - s.ox) / s.k;
  vb.y = knijp.m[1] - (cy - s.r.top - s.oy) / s.k;
  zetViewBox();
}

plaat.addEventListener('pointerdown', function (e) {
  audio();
  if (e.pointerType === 'pen') penGezien = true;
  if (e.pointerType === 'touch') {
    vingers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (vingers.size === 2) { startKnijp(); return; }
    if (vingers.size > 2 || penGezien) return;   // handpalm negeren zodra de Apple Pencil gebruikt is
  }
  if (knijp || actievePointer !== null) return;
  e.preventDefault();

  if (tool === 'hand') {
    actievePointer = e.pointerId;
    try { plaat.setPointerCapture(e.pointerId); } catch (err) {}
    schuif = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y, k: schermInfo().k };
    return;
  }
  const geraakt = (e.target && e.target !== plaat) ? e.target : document.elementFromPoint(e.clientX, e.clientY);
  if (tool === 'vul') {
    const el = geraakt && geraakt.closest ? geraakt.closest('.r') : null;
    if (!el) return;
    if (e.pointerType === 'touch') wachtVul = { id: e.pointerId, el: el, x: e.clientX, y: e.clientY };
    else vul(el);
    return;
  }
  actievePointer = e.pointerId;
  try { plaat.setPointerCapture(e.pointerId); } catch (err) {}
  if (tool === 'gum') { gumOp(e); gumBezig = true; return; }

  // Pen of potlood
  lijnIdx = -1;
  if (binnenLijntjes) {
    const regio = geraakt && geraakt.closest ? geraakt.closest('.r') : null;
    if (!regio) { actievePointer = null; return; }
    lijnIdx = Array.prototype.indexOf.call(plaat.querySelectorAll('.r'), regio);
  }
  punten = [svgPunt(e)];
  lijn = maakPenPad(padVanPunten(punten), kleur, document.getElementById('dikte').value, tool);
  laagVoor(plaat, tool, lijnIdx).appendChild(lijn);
  geluid('pen');
});

plaat.addEventListener('pointermove', function (e) {
  if (vingers.has(e.pointerId)) {
    vingers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (knijp) { e.preventDefault(); updateKnijp(); return; }
    if (wachtVul && wachtVul.id === e.pointerId && Math.hypot(e.clientX - wachtVul.x, e.clientY - wachtVul.y) > 12) wachtVul = null;
  }
  if (e.pointerId !== actievePointer) return;
  e.preventDefault();
  if (schuif) {
    vb.x = schuif.vx - (e.clientX - schuif.x) / schuif.k;
    vb.y = schuif.vy - (e.clientY - schuif.y) / schuif.k;
    zetViewBox(); return;
  }
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  if (tool === 'gum') { (events.length ? events : [e]).forEach(gumOp); return; }
  if (!lijn) return;
  (events.length ? events : [e]).forEach(ev => {
    const p = svgPunt(ev), l = punten[punten.length - 1];
    if (Math.abs(p[0] - l[0]) + Math.abs(p[1] - l[1]) > 0.8 * vb.w / 400) punten.push(p);
  });
  lijn.setAttribute('d', padVanPunten(punten));
});

function stopPointer(e) {
  if (vingers.has(e.pointerId)) {
    vingers.delete(e.pointerId);
    if (knijp) { if (vingers.size === 0) knijp = null; return; }
    if (wachtVul && wachtVul.id === e.pointerId) { vul(wachtVul.el); wachtVul = null; }
  }
  if (e.pointerId !== actievePointer) return;
  actievePointer = null; gumBezig = false; schuif = null;
  if (lijn) { geschiedenis.push({ type: 'pen', el: lijn }); lijn = null; bewaarStaat(); }
}
plaat.addEventListener('pointerup', stopPointer);
plaat.addEventListener('pointercancel', stopPointer);


function ongedaan() {
  const a = geschiedenis.pop();
  if (!a) { melding('Niets meer om terug te doen'); return; }
  geluid('terug');
  if (a.type === 'vul') a.el.setAttribute('fill', a.oud);
  else if (a.type === 'pen') a.el.remove();
  else if (a.type === 'wis') a.ouder.insertBefore(a.el, a.volgende && a.volgende.parentNode === a.ouder ? a.volgende : null);
  else if (a.type === 'reset') {
    const regs = plaat.querySelectorAll('.r');
    a.fills.forEach((v, i) => regs[i].setAttribute('fill', v));
    a.pen.forEach(x => x[1].appendChild(x[0]));
  }
  bewaarStaat();
}
function wisAlles() {
  if (!confirm('Wil je deze kleurplaat helemaal opnieuw beginnen?')) return;
  const regs = Array.from(plaat.querySelectorAll('.r'));
  const pen = Array.from(plaat.querySelectorAll('.pen'));
  geschiedenis.push({ type: 'reset', fills: regs.map(r => r.getAttribute('fill')), pen: pen.map(el => [el, el.parentNode]) });
  regs.forEach(r => r.setAttribute('fill', '#ffffff'));
  pen.forEach(el => el.remove());
  bewaarStaat(); geluid('wis');
  melding('Weer helemaal leeg 🧼');
}

// Lettertype insluiten zodat namen er in het plaatje hetzelfde uitzien
let fontCssCache = null;
async function haalFontCss() {
  if (fontCssCache !== null) return fontCssCache;
  try {
    const css = await (await fetch('https://fonts.googleapis.com/css2?family=Nunito:wght@900&text=' + encodeURIComponent('MilouDeSterkij'))).text();
    const url = (css.match(/url\(([^)]+)\)/) || [])[1];
    const blob = await (await fetch(url)).blob();
    const data = await new Promise(function (res) { const r = new FileReader(); r.onload = function () { res(r.result); }; r.readAsDataURL(blob); });
    fontCssCache = "@font-face{font-family:'Nunito';font-weight:900;src:url(" + data + ")}";
  } catch (e) { fontCssCache = ''; }
  return fontCssCache;
}

// Opslaan als plaatje (naar Foto's via delen)
async function opslaan() {
  bewaarStaat();
  const kloon = plaat.cloneNode(true);
  if (kloon.querySelector('text')) {
    const css = await haalFontCss();
    if (css) { const st = document.createElementNS('http://www.w3.org/2000/svg', 'style'); st.textContent = css; kloon.insertBefore(st, kloon.firstChild); }
  }
  kloon.setAttribute('width', '1200'); kloon.setAttribute('height', '1200');
  kloon.removeAttribute('class');
  const tekst = new XMLSerializer().serializeToString(kloon);
  const img = new Image();
  img.onload = function () {
    const c = document.createElement('canvas');
    c.width = 1200; c.height = 1200;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 1200, 1200);
    ctx.drawImage(img, 0, 0, 1200, 1200);
    c.toBlob(async function (blob) {
      const naam = 'kleurplaat-' + huidig.id + '.png';
      try {
        const bestand = new File([blob], naam, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [bestand] })) {
          await navigator.share({ files: [bestand], title: 'Mijn kleurplaat' });
          return;
        }
      } catch (err) { if (err && err.name === 'AbortError') return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = naam; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      melding('Opgeslagen! 💾');
    }, 'image/png');
  };
  img.onerror = function () { melding('Opslaan lukte niet, probeer opnieuw'); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(tekst);
}

let meldTimer = null;
function melding(t) {
  const m = document.getElementById('melding');
  m.textContent = t; m.classList.add('toon');
  clearTimeout(meldTimer); meldTimer = setTimeout(function () { m.classList.remove('toon'); }, 2000);
}

bouwTabs(); bouwGrid();
